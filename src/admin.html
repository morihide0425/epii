<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>épii 予約管理</title>

<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/admin.webmanifest">
<meta name="apple-mobile-web-app-title" content="épii 予約">
<meta name="theme-color" content="#F3F2EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F2EF; --card: #FFFFFF; --ink: #1F1F1F; --sub: #6F6D69; --faint: #BDBAB4; --line: #E4E2DD; --line2: #D3CFC6;
    --red: #AE3F2C; --red-l: #F7E8E4; --blue: #3F7485; --blue-l: #E6EFF2; --green: #3F7D58; --green-l: #E6F1EA;
    --amber: #9A6A12; --amber-l: #F8EFD9; --gray-l: #E8E6E1;
    --gothic: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  /* 描き直しで画面がずれないよう、ブラウザが自動でスクロールを合わせる動きは使わない */
  html { -webkit-text-size-adjust: 100%; overflow-anchor: none; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--gothic); font-size: 15px; line-height: 1.6;
    padding-top: env(safe-area-inset-top, 0px); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  .lat { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; }
  svg.ink { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding: 12px 16px 6px; display: flex; align-items: center; gap: 10px; }
  header .lat { font-size: 26px; line-height: 1; }
  header .ttl { font-size: 17px; font-weight: 700; }
  header .sync { margin-left: auto; font-size: 11px; color: var(--sub); }
  main { max-width: 620px; margin: 0 auto; padding: 4px 14px calc(86px + env(safe-area-inset-bottom, 0px)); }
  .card { background: var(--card); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; }
  .card.alert { border-left: 3px solid var(--red); }
  h2 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  h2 svg { width: 22px; height: 22px; flex-shrink: 0; }
  h2 .cnt { font-size: 12px; color: var(--sub); font-weight: 400; }
  h2 .more { margin-left: auto; font-size: 12px; color: var(--blue); font-weight: 400; background: none; border: 0; padding: 0; }
  h3 { font-size: 13px; margin: 12px 0 6px; color: var(--sub); font-weight: 500; }
  .sub { color: var(--sub); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .btn { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line2); background: #fff; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn svg { width: 18px; height: 18px; }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }
  .btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.wide { width: 100%; }
  .btn.small { padding: 4px 11px; font-size: 12px; }
  .btn.danger { color: var(--red); }
  .btn.ghost { border-color: transparent; color: var(--blue); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line2); background: #fff; font-size: 13px; margin: 0 6px 6px 0; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip.red { background: var(--red); border-color: var(--red); color: #fff; }
  label.f { display: block; font-size: 12px; color: var(--sub); margin: 10px 0 4px; }
  input[type=text], input[type=tel], input[type=number], input[type=password], input[type=date], input[type=time], select, textarea {
    width: 100%; min-width: 0; padding: 9px 11px; border: 1px solid var(--line2); border-radius: 10px; background: #fff; font-size: 16px; }
  input[type=checkbox], input[type=radio] { width: 18px; height: 18px; accent-color: var(--ink); }
  textarea { line-height: 1.6; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .tag { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 11px; line-height: 20px; white-space: nowrap; }
  .tag.red { background: var(--red-l); color: var(--red); } .tag.green { background: var(--green-l); color: var(--green); }
  .tag.blue { background: var(--blue-l); color: var(--blue); } .tag.amber { background: var(--amber-l); color: var(--amber); }
  .tag.gray { background: var(--gray-l); color: var(--sub); } .tag:not([class*=" "]) { background: var(--blue-l); color: var(--blue); }
  .kv { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 2px 8px; font-size: 13px; margin-top: 6px; }
  .kv dt { color: var(--sub); } .kv dd { margin: 0; }
  .err { color: var(--red); font-size: 13px; min-height: 1em; margin: 6px 0 0; }
  .warn { background: var(--amber-l); color: var(--amber); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-top: 8px; }
  .panel { background: var(--bg); border-radius: 12px; padding: 12px; margin-top: 10px; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90vw; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; color: var(--sub); padding: 30px 0; }
  .hidden { display: none !important; }

  /* 数字 */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi { background: var(--card); border-radius: 16px; padding: 10px 8px; text-align: center; border: 0; font: inherit; color: var(--ink); }
  .kpi.alert { background: var(--red); color: #fff; }
  .kpi .v { font-size: 24px; font-weight: 700; line-height: 1.1; } .kpi .v small { font-size: 13px; font-weight: 400; }
  .kpi .k { font-size: 11px; opacity: .8; margin-top: 2px; }
  /* 予約の行 */
  .res { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
  .res:first-child { border-top: 0; padding-top: 4px; }
  .res .t { font-size: 17px; font-weight: 700; line-height: 1.2; } .res .t small { display: block; font-size: 10px; color: var(--sub); font-weight: 400; }
  .res .n { font-size: 15px; font-weight: 600; } .res .n .g { font-weight: 400; color: var(--sub); font-size: 13px; }
  .res .d { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .res .act { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .res.done { opacity: .55; } .res.canceled { opacity: .45; }
  .resbody { grid-column: 1 / -1; }
  .chk { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line2); background: #fff; display: flex; align-items: center; justify-content: center; padding: 0; }
  .chk svg { width: 18px; height: 18px; } .chk.on { background: var(--green); border-color: var(--green); }
  .chk.no { background: var(--gray-l); border-color: var(--gray-l); }
  /* 混み具合 */
  .bars .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 64px; align-items: center; gap: 8px; height: 26px; font-size: 12px; }
  .bars .track { height: 12px; border-radius: 6px; background: var(--bg); overflow: hidden; display: flex; }
  .bars .f { height: 100%; } .bars .f.ok { background: var(--green); } .bars .f.wait { background: var(--amber); }
  .bars .f.tent, .legend i.tentlg { background: repeating-linear-gradient(45deg, var(--amber) 0 3px, var(--amber-l) 3px 6px); }
  .bars .f.tent { box-shadow: inset 0 0 0 1px var(--amber); }
  .bars .tentn { color: var(--amber); font-size: 11px; margin-left: 2px; }
  .bars .row { grid-template-columns: 44px minmax(0, 1fr) 88px; }
  .bars .f.blk { background: repeating-linear-gradient(45deg, var(--faint) 0 3px, var(--line) 3px 6px); }
  .bars .r { text-align: right; color: var(--sub); white-space: nowrap; } .bars .r.full { color: var(--red); font-weight: 700; }
  .bars .sess { font-size: 11px; color: var(--sub); margin: 8px 0 2px; }
  .bars .row.stopped .track { background: repeating-linear-gradient(45deg, var(--line) 0 4px, var(--bg) 4px 8px); }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--sub); margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 3px; }
  /* 週 */
  .week { display: grid; grid-template-columns: 28px repeat(7, minmax(0, 1fr)) 28px; gap: 3px; margin-top: 4px; align-items: stretch; }
  .week .nav { border: 0; background: none; font-size: 18px; color: var(--sub); padding: 0; }
  .wd { text-align: center; border-radius: 12px; padding: 6px 1px 4px; font-size: 12px; border: 0; background: #fff; font: inherit; color: var(--ink); }
  .wd .dn { font-size: 10px; color: var(--sub); } .wd .dd { font-size: 16px; font-weight: 700; } .wd .pp { font-size: 10px; color: var(--sub); }
  .wd.sel { outline: 2px solid var(--ink); } .wd.has { background: var(--green-l); } .wd.busy { background: var(--amber-l); }
  .wd.off { background: var(--gray-l); color: var(--faint); } .wd.off .pp, .wd.off .dn { color: var(--faint); }
  .wd.past { opacity: .55; }
  /* 大きめの操作ボタン */
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .qbtn { border: 1px solid var(--line2); background: #fff; border-radius: 16px; padding: 10px; text-align: left; display: flex; gap: 10px; align-items: center; }
  .qbtn svg { width: 28px; height: 28px; flex-shrink: 0; }
  .qbtn b { display: block; font-size: 14px; } .qbtn span { font-size: 11px; color: var(--sub); }
  .qbtn.on { border-color: var(--ink); background: var(--bg); }
  .sheet { background: #fff; border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; border: 2px solid var(--ink); }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line2); background: #fff; font-size: 18px; }
  .stepper .n { font-size: 22px; font-weight: 700; min-width: 24px; text-align: center; }
  /* 月カレンダー */
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; text-align: center; }
  .cal .wdh { font-size: 11px; color: var(--sub); }
  .day { border: none; background: transparent; border-radius: 10px; padding: 5px 1px 3px; line-height: 1.2; min-height: 44px; font-size: 13px; }
  .day small { display: block; font-size: 9px; color: var(--blue); white-space: nowrap; }
  .day .n { display: block; font-size: 9px; color: var(--sub); }
  .day.past { opacity: .5; } .day.off { background: var(--gray-l); color: var(--sub); } .day.off small { color: var(--sub); }
  .day.has { background: var(--green-l); } .day.busy { background: var(--amber-l); }
  .day.ov { box-shadow: inset 0 0 0 1.5px var(--red); }
  .day.sel { background: var(--ink); color: #fff; box-shadow: none; } .day.sel small, .day.sel .n { color: #fff; }
  /* お客様 */
  .search { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 14px; padding: 6px 12px; margin-bottom: 12px; }
  .search svg { width: 20px; height: 20px; flex-shrink: 0; }
  .search input { border: 0; padding: 6px 0; font-size: 15px; }
  .cust { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
  .cust:first-child { border-top: 0; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: var(--blue-l); color: var(--blue); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .av.vip { background: var(--red-l); color: var(--red); }
  .cust .n { font-weight: 600; font-size: 15px; } .cust .m { font-size: 12px; color: var(--sub); }
  .cust .r { margin-left: auto; text-align: right; font-size: 12px; color: var(--sub); white-space: nowrap; }
  .cust .r b { display: block; font-size: 16px; color: var(--ink); }
  .cust .n { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cust .m { margin-top: 2px; }
  .cust .upnext { color: var(--green); font-weight: 600; }
  .namebtn { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }
  .cust .chev { margin-left: auto; color: var(--faint); font-size: 22px; }
  .av { font-size: 16px; }
  #openBox { scroll-margin-top: 70px; }
  .ins { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .ins:first-of-type { border-top: 0; }
  .ins .ic { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .ins.good .ic { background: var(--green-l); color: var(--green); }
  .ins.warn .ic { background: var(--red-l); color: var(--red); }
  .ins.info .ic { background: var(--blue-l); color: var(--blue); }
  .ins b { font-size: 14px; line-height: 1.4; display: block; }
  .ins .sub { margin-top: 2px; line-height: 1.6; }
  .ins .ref { font-size: 11px; color: var(--faint); margin-top: 2px; }
  .seg { display: flex; background: var(--card); border-radius: 12px; padding: 4px; margin-bottom: 10px; gap: 4px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 8px; font-size: 14px; color: var(--sub); }
  .seg button.on { background: var(--ink); color: #fff; font-weight: 700; }
  .ins.act .ic { background: var(--red); color: #fff; font-size: 10px; }
  .todo { margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--bg); border-radius: 8px; padding: 6px 8px; }
  .chart.ig .cb { max-width: 18px; }
  .sdot { color: var(--amber); font-style: normal; font-size: 9px; }
  .mstats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--sub); margin-top: 4px; }
  .mstats b { color: var(--ink); }
  .why { margin-top: 10px; background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--sub); line-height: 1.6; }
  .chart { display: flex; align-items: flex-end; gap: 2px; height: 150px; padding-top: 14px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; position: relative; }
  .chart .cb { width: 100%; max-width: 18px; background: var(--green); border-radius: 3px 3px 0 0; min-height: 1px; }
  .chart .cv { font-size: 9px; color: var(--sub); line-height: 1.2; }
  .chart .cl { position: absolute; bottom: -18px; font-size: 9px; color: var(--sub); white-space: nowrap; }
  .chart { margin-bottom: 20px; }
  .frow { display: grid; grid-template-columns: 128px minmax(0, 1fr) 44px; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; }
  .frow .ft { height: 12px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .frow .fb { height: 100%; background: var(--blue); }
  .frow .fn { text-align: right; font-weight: 600; }
  .frow .fl { white-space: nowrap; font-size: 12px; }
  .ecrow { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-top: 1px dashed var(--line); }
  .eclabel { width: 78px; flex-shrink: 0; font-size: 13px; font-weight: 600; line-height: 1.3; }
  .ecchips { flex: 1; display: flex; flex-wrap: wrap; }
  .openbar { display: flex; gap: 10px; align-items: center; border-radius: 16px; padding: 10px 12px; margin-bottom: 12px; background: var(--green-l); }
  .openbar svg { width: 26px; height: 26px; }
  .openbar b { font-size: 14px; }
  .openbar.warn { background: var(--amber-l); } .openbar.warn b { color: var(--amber); }
  .openbar.over { background: var(--red-l); } .openbar.over b { color: var(--red); }
  .day.notyet:not(.off):not(.sel) { background: repeating-linear-gradient(45deg, var(--line) 0 3px, #fff 3px 6px); color: var(--sub); }
  .day.notyet small { color: var(--sub); }
  .filters { display: flex; gap: 0; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; -webkit-overflow-scrolling: touch; }
  .filters .chip { flex-shrink: 0; white-space: nowrap; }
  .filters .fc { font-size: 11px; opacity: .7; margin-left: 2px; }
  .visits { margin-top: 12px; border-top: 1px solid var(--line); }
  .visits .row { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .visits .stepper button { width: 32px; height: 32px; font-size: 16px; }
  .visits .stepper .n { font-size: 18px; min-width: 28px; }
  .hist { font-size: 13px; padding: 8px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .hist .dt { color: var(--sub); width: 96px; flex-shrink: 0; }
  .memo { background: var(--amber-l); color: var(--amber); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  /* 設定 */
  .field { padding: 10px 0; border-top: 1px solid var(--line); }
  .field .row input { width: 76px; text-align: right; } .field .unit { min-width: 60px; white-space: nowrap; }
  .sessbox { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 12px; scroll-margin-top: 96px; }
  .course { display: flex; align-items: center; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
  .course.off .body { opacity: .45; } .course .body { flex: 1; min-width: 0; }
  .icon { background: none; border: none; padding: 6px 8px; color: var(--sub); font-size: 16px; }
  .sw { width: 46px; height: 28px; border-radius: 14px; border: none; position: relative; background: #CFCBC3; flex-shrink: 0; }
  .sw.on { background: var(--green); }
  .sw .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff; }
  .sw.on .knob { left: 21px; }
  .weekrow { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
  .wday { width: 28px; height: 28px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .wday.off { color: var(--faint); }
  .wchips { flex: 1; display: flex; flex-wrap: wrap; align-items: center; }
  .item { padding: 10px 0; border-top: 1px solid var(--line); } .item:first-child { border-top: 0; }
  .pmark { color: var(--amber); }
  /* 下部タブ */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 0 calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
  nav.tabs button { border: 0; background: none; font-size: 10px; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0; position: relative; }
  nav.tabs button svg { width: 26px; height: 26px; }
  nav.tabs button.on { color: var(--red); font-weight: 700; }
  nav.tabs button.on svg { stroke: var(--red); }
  nav.tabs .tabind { position: absolute; top: -1px; left: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--red); }
  .week .nav svg, .iconbtn svg, .course .icon svg { width: 18px; height: 18px; display: block; }
  .iconbtn { padding: 5px 8px; }
  .chart .col { cursor: default; }
  nav.tabs .badge { position: absolute; top: -2px; right: calc(50% - 22px); background: var(--red); color: #fff; font-size: 10px; border-radius: 9px; min-width: 16px; line-height: 16px; text-align: center; padding: 0 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<svg width="0" height="0" style="position:absolute">

<div class="toast" id="toast" role="status"></div>

<script>
const BOOT = "__BOOT__";
/*__SHARED__*/
/*__MOTION__*/

const SHOP = BOOT.shop;
const SN = key => (S.settings ? sessionLabel(S.settings, key) : key);
const SHORT = key => (S.settings ? sessionShort(S.settings, key) : String(key).slice(0, 1));
const KEYS = () => (S.settings ? sessionKeys(S.settings) : []);
const WD = '日月火水木金土';
const $ = id => document.getElementById(id);
const TAB_TITLE = { today: '今日', book: '予約', cust: 'お客様', set: '設定' };
const S = {
  tab: 'today', now: '', settings: null, courses: [], liffUrl: '',
  req: null, drafts: {},
  day: '', cancelFor: '', edit: null, addOpen: false, blockOpen: false, blockType: 'seats', upcoming: null,
  month: '', calOpen: false, planOpen: false, calWarn: '',
  custQ: '', custList: null, custSel: null, memoEdit: false,
  custFilter: 'all', custAdd: null, mergeOpen: false, mergeQ: '', dupes: [],
  editCourse: null, quota: null, setPart: 'rules', an: null, anDays: 30, anView: 'site', ig: null,
  // 一度読み込んだものは手元に置いておき、すぐ表示してから裏で最新にする
  dayCache: {}, monthCache: {}, monthFresh: {}, custCache: {}, scroll: {}
};
// 予約タブで選んでいる日・月のデータ、開いているお客様
Object.defineProperty(S, 'dayData', { get: () => S.dayCache[S.day] || null });
Object.defineProperty(S, 'monthData', { get: () => S.monthCache[S.day.slice(0, 7)] || null });
Object.defineProperty(S, 'custDetail', { get: () => (S.custSel ? S.custCache[S.custSel] || null : null) });
function putDay(d) { S.dayCache[d.date] = d; }
function putMonth(ym, m) { m.ym = ym; S.monthCache[ym] = m; S.monthFresh[ym] = true; setNow(m.now); }
// 予約の人数が変わったので、月の一覧は次に開いたときに取り直す
function staleMonths() { S.monthFresh = {}; }
// 日付が変わったら、予約タブも今日に合わせる
function setNow(now) {
  if (!now) return;
  const was = S.now.slice(0, 10);
  S.now = now;
  if (was && was !== now.slice(0, 10) && S.day === was) S.day = now.slice(0, 10);
}

/* ---------- 共通 ---------- */
function esc(v) {
  return String(v === undefined || v === null ? '' : v)
    .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function jd(date) { if (!date) return ''; const p = date.split('-').map(Number); return p[1] + '/' + p[2] + '（' + WD[weekday(date)] + '）'; }
function jdLong(date) { const p = date.split('-').map(Number); return p[0] + '年' + p[1] + '月' + p[2] + '日（' + WD[weekday(date)] + '）'; }
function yen(n) { return '¥' + Number(n || 0).toLocaleString(); }
function priceText(c) { return yen(c.price) + (c.price_type === 'from' ? '〜' : ''); }
function today() { return S.now.slice(0, 10); }
function toast(msg) { M.toast($('toast'), msg, 2400); }
// 画面の描き替え：作り直さず変わったところだけ書き換え、前後で選択の印やスイッチ、バーを動かす
// （内容が前と同じなら何もしない。スクロールの位置や入力中の文字はそのまま残る）
let lastView = null;
function setView(h) {
  const v = $('view');
  if (h === lastView && !v.querySelector('.m-busy')) return;
  lastView = h;
  M.capture(v);
  M.patch(v, h);
  M.play(v);
}
function ruleText(rule) {
  const d = Number(rule.days);
  if (d === 0) return '当日' + rule.time + 'まで';
  return rule.time === '23:59' ? d + '日前まで' : d + '日前の' + rule.time + 'まで';
}
function planText(plan) {
  if (plan.kind === 'off') return '休み';
  if (plan.kind === 'private') return '貸切';
  return KEYS().filter(k => plan.sessions.indexOf(k) >= 0).map(k => SN(k)).join('・');
}
function setSync(text) { $('sync').textContent = text || ''; }

async function api(fn, body) {
  let res;
  try {
    res = await fetch('/admin/api/' + fn, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'content-type': 'application/json', 'x-epii': '1' },
      body: JSON.stringify(body || {})
    });
  } catch (e) {
    throw new Error('通信できませんでした。電波の良い場所でもう一度お試しください。');
  }
  let data;
  try { data = await res.json(); } catch (e) { throw new Error('サーバーから正しい返事がありませんでした（' + res.status + '）。'); }
  if (res.status === 401 && fn !== 'login') { showLogin(); throw new Error('ログインしてください。'); }
  if (!data.ok && !data.full && !data.confirm) {
    const e = new Error(data.message || 'エラーが起きました。');
    e.code = data.code || '';
    throw e;
  }
  return data;
}
function fail(e) { if (e && e.message !== 'ログインしてください。') alert(e.message); }

/* ---------- ログイン ---------- */

/* ---------- ログイン ---------- */
function showLogin() {
  $('bootView').classList.add('hidden');
  $('appView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  setTimeout(() => $('pw').focus(), 50);
}

async function login() {
  const pw = $('pw').value;
  if (!pw) { $('loginErr').textContent = 'パスワードを入力してください。'; return; }
  const mo = M.busy($('loginBtn'));
  $('loginErr').textContent = '';
  try {
    await api('login', { password: pw });
    await mo.ok();
    $('pw').value = '';
    await boot();
  } catch (e) {
    mo.fail();
    $('loginErr').textContent = e.message;
  }
}

async function boot() {
  try {
    const d = await api('boot');
    setNow(d.now);
    S.settings = d.settings;
    S.courses = d.courses;
    S.liffUrl = d.liffUrl;
    S.req = d.requests;
    S.day = S.day || today();
    S.month = S.month || today().slice(0, 7);
    $('bootView').classList.add('hidden');
    $('loginView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    prepareDrafts();
    showTab(S.tab);
  } catch (e) {
    if (e.message !== 'ログインしてください。') {
      $('bootView').innerHTML = '<p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">もう一度読み込む</button>';
    }
  }
}

function setBadge() {
  const n = S.req ? S.req.waiting.length + (S.req.changes || []).length : 0;
  $('reqBadge').innerHTML = n ? '<span class="badge">' + n + '</span>' : '';
}

// タブを切り替える。手元のデータですぐ表示し、裏で最新にする
// 前に見ていた位置を覚えておき、戻ったときはそこから表示する（top のときは一番上から）
async function showTab(tab, top) {
  const from = S.tab;
  if (from !== tab) { S.scroll[from] = window.scrollY; $('view').style.minHeight = ''; }
  S.tab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
  M.indicator($('tabind'), document.querySelector('.tab.on'), 28);
  $('ttl').textContent = TAB_TITLE[tab] || '';
  const view = VIEWS[tab];
  if (view.ready()) view.render(); else setView('<div class="loading">読み込み中…</div>');
  const y = top ? 0 : from !== tab ? (S.scroll[tab] || 0) : null;
  if (y !== null) window.scrollTo(0, y);
  const y1 = window.scrollY;
  await reload();
  // 読み込む前は画面が短くて戻しきれなかったときは、読み込んだあとにもう一度戻す（自分で動かしていなければ）
  if (y && S.tab === tab && window.scrollY === y1 && y1 < y) window.scrollTo(0, y);
}

// 今のタブを裏で取り直して、変わったところだけ描き直す（スクロールの位置はそのまま）
let gen = 0, saves = 0, reloadAfterSave = false;
async function reload() {
  const tab = S.tab, g = gen;
  setSync('更新中…');
  try {
    const apply = await VIEWS[tab].load();
    // 取り直しているあいだに手元を先に書き換えたときは、古い結果で上書きせず、保存が終わってから取り直す
    if (g !== gen || saves) { if (saves) reloadAfterSave = true; else reload(); return; }
    if (apply) apply();
    renderWhenIdle(tab);
    setSync('');
  } catch (e) {
    setSync('');
    fail(e);
  }
}

// 送信中の動き（丸→チェック）の途中は描き直さず、動きが終わってから描き直す
function renderWhenIdle(tab) {
  if (S.tab !== tab) return;
  if ($('view').querySelector('.m-busy')) setTimeout(() => renderWhenIdle(tab), 300);
  else VIEWS[tab].render();
}

// 保存は送った順に1つずつ行う（続けて押しても、あとの操作が先に届いて食い違わないように）
let saveChain = Promise.resolve();
function save(fn) {
  gen++; saves++;
  const p = saveChain.then(fn);
  saveChain = p.catch(() => {});
  return p.finally(() => {
    saves--; gen++;
    if (!saves && reloadAfterSave) { reloadAfterSave = false; reload(); }
  });
}

function refresh() { VIEWS[S.tab].render(); }
function icon(name) { return `<svg class="ink"><use href="#${name}"/></svg>`; }

/* ---------- 返事の下書き ---------- */
function chgTemplate(c, mode) {
  const sign = '\n\n' + SHOP.name + '\nTEL ' + SHOP.tel;
  if (mode === 'ok') {
    return c.name + ' 様\n\nご予約の変更を承りました。\n\n【変更前】\n日時：' + jdLong(c.oldDate) + ' ' + c.oldTime +
      '\n人数：' + c.oldGuests + '名\nメニュー：' + c.oldCourse +
      '\n\n【変更後】\n日時：' + jdLong(c.date) + ' ' + c.time + '\n人数：' + c.guests + '名\nメニュー：' + c.course +
      '\n\nご来店を心よりお待ちしております。' + sign;
  }
  return c.name + ' 様\n\nご予約の変更をご希望いただき、ありがとうございます。\n誠に申し訳ございませんが、ご希望の日時はお席をご用意できませんでした。\n\n' +
    'つきましては、下記のご予約はそのままとさせていただきます。\n日時：' + jdLong(c.oldDate) + ' ' + c.oldTime +
    '\n人数：' + c.oldGuests + '名\nメニュー：' + c.oldCourse +
    '\n\nご都合が合わない場合は、お手数ですがお電話にてご相談ください。' + sign;
}

function prepareDrafts() {
  (S.req.changes || []).forEach(c => {
    const key = 'g' + c.id;
    if (!S.drafts[key]) S.drafts[key] = { mode: c.left >= c.guests ? 'ok' : 'ng', text: '', edited: false };
    const d = S.drafts[key];
    if (!d.edited) d.text = chgTemplate(c, d.mode);
  });
  S.req.waiting.forEach(r => {
    if (!S.drafts[r.id]) {
      S.drafts[r.id] = {
        mode: r.left >= r.guests ? 'ok' : (r.altDate && r.altLeft >= r.guests ? 'ok2' : 'offer'),
        offer: 0, text: '', edited: false
      };
    }
    const d = S.drafts[r.id];
    if (!d.edited) d.text = template(r, d);
  });
  setBadge();
}

function template(r, d) {
  const sign = '\n\n' + SHOP.name + '\nTEL ' + SHOP.tel + '\n' + SHOP.access[0][0] + ' ' + SHOP.access[0][1];
  if (d.mode === 'ok' || d.mode === 'ok2') {
    const date = d.mode === 'ok2' ? r.altDate : r.date;
    const time = d.mode === 'ok2' ? r.altTime : r.time;
    return r.name + ' 様\n\nこの度はご予約のリクエストをありがとうございます。\n' +
      (d.mode === 'ok2' ? '第1希望の日時は満席のため、第2希望の日時で' : '下記の内容で') + 'ご予約を承りました。\n\n' +
      '日時：' + jdLong(date) + ' ' + time + '\n人数：' + r.guests + '名\nメニュー：' + r.course +
      '\n\nご来店を心よりお待ちしております。' + sign;
  }
  if (d.mode === 'offer') {
    const o = r.suggestions[d.offer];
    return r.name + ' 様\n\nこの度はご予約のリクエストをありがとうございます。\nあいにく ' + jd(r.date) + ' ' + r.time +
      ' はお席のご用意が難しい状況です。\n\n' + (o ? jdLong(o.date) + ' ' + o.time : '（日時を選んでください）') +
      ' でしたらご案内できます。\nよろしければ、下のボタンからご返事をお願いいたします。' + sign;
  }
  return r.name + ' 様\n\nこの度はご予約のリクエストをありがとうございます。\n誠に申し訳ございませんが、ご希望の日時はお席をご用意することができませんでした。\n\nまたのご来店を心よりお待ちしております。' + sign;
}

function leftTag(left, guests) {
  if (left === null || left === undefined) return '';
  return left >= guests
    ? '<span class="tag green">空き ' + left + '席</span>'
    : '<span class="tag red">席が足りません（空き ' + left + '席）</span>';
}


/* ---------- 返事の送信 ---------- */
async function offerSkipLine(err, retry) {
  if (err.code !== 'LINE_FAILED') return false;
  if (!confirm(err.message + '\n\nLINEを送らずに、この内容で反映しますか？\n（お客様へは、お電話などでご連絡ください）')) return true;
  await retry();
  return true;
}

async function sendChangeReply(c, d, btn, force, skipLine) {
  const er = document.querySelector(`[data-cerr="${CSS.escape(c.id)}"]`);
  if (!d.text.trim()) { er.textContent = '送る文面を入力してください。'; return; }
  if (!force && !confirm(c.name + ' 様に「' + (d.mode === 'ok' ? '変更を承認' : 'お断り') + '」の返事をLINEで送ります。よろしいですか？')) return;
  const mo = M.busy(btn);
  try {
    const res = await api('replyChange', { id: c.id, mode: d.mode, text: d.text, force: force, skipLine: !!skipLine });
    if (res.full) {
      mo.fail();
      if (confirm(res.message)) await sendChangeReply(c, d, btn, true);
      return;
    }
    delete S.drafts['g' + c.id];
    S.req = res.requests;
    prepareDrafts();
    await mo.ok();
    toast('LINEで返事を送りました');
    refresh();
    staleMonths();
    reload();
  } catch (e) {
    mo.fail();
    const handled = await offerSkipLine(e, () => sendChangeReply(c, d, btn, true, true));
    if (!handled) er.textContent = e.message;
  }
}

async function sendReply(r, d, btn, force, skipLine) {
  const er = document.querySelector(`[data-err="${CSS.escape(r.id)}"]`);
  if (!d.text.trim()) { er.textContent = '送る文面を入力してください。'; return; }
  const offer = d.mode === 'offer' ? r.suggestions[d.offer] : null;
  if (d.mode === 'offer' && !offer) { er.textContent = '提案する日時を選んでください。'; return; }
  const label = { ok: '承認', ok2: '第2希望で承認', offer: '別の日時を提案', ng: 'お断り' }[d.mode];
  if (!force && !confirm(r.name + ' 様に「' + label + '」の返事をLINEで送ります。よろしいですか？')) return;
  const mo = M.busy(btn);
  try {
    const res = await api('reply', { id: r.id, mode: d.mode, text: d.text, offer: offer, force: force, skipLine: !!skipLine });
    if (res.full) {
      mo.fail();
      if (confirm(res.message)) await sendReply(r, d, btn, true);
      return;
    }
    delete S.drafts[r.id];
    S.req = res.requests;
    prepareDrafts();
    await mo.ok();
    toast('LINEで返事を送りました');
    refresh();
    staleMonths();
    reload();
  } catch (e) {
    mo.fail();
    const handled = await offerSkipLine(e, () => sendReply(r, d, btn, true, true));
    if (!handled) er.textContent = e.message;
  }
}

// 予約の受付期間（今日の画面に表示）
function openStatusHtml() {
  const s = S.settings;
  const end = bookingEnd(s, today());
  const left = diffDaysJs(today(), end);
  if (!s.openUntil) {
    return `<div class="openbar warn"><div>${icon('i-cal')}</div><div style="flex:1"><b>今日から${s.aheadDays}日先まで自動で受付中</b>
      <div class="sub">月ごとに開ける場合は、受付の最終日を決めてください</div></div>
      <button class="btn small" data-act="goOpen">決める</button></div>`;
  }
  const cls = left < 0 ? 'over' : left <= 7 ? 'over' : left <= 14 ? 'warn' : 'ok';
  const msg = left < 0 ? '受付期間が終わっています' : left === 0 ? '今日で受付期間が終わります' : 'あと' + left + '日';
  return `<div class="openbar ${cls}"><div>${icon('i-cal')}</div><div style="flex:1"><b>${jd(end)}まで予約受付中</b>
    <div class="sub">${msg}${left <= 14 ? '・次の月を開けるのを忘れずに' : ''}</div></div>
    <button class="btn small ${left <= 14 ? 'primary' : ''}" data-act="goOpen">${left <= 14 ? '延ばす' : '変更'}</button></div>`;
}
function diffDaysJs(a, b) {
  const x = a.split('-').map(Number), y = b.split('-').map(Number);
  return Math.round((Date.UTC(y[0], y[1] - 1, y[2]) - Date.UTC(x[0], x[1] - 1, x[2])) / 86400000);
}
function monthEnd(date, add) {
  const p = date.split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1 + add + 1, 0));
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
}

function barsHtml(d) {
  const keys = KEYS();
  let h = '';
  keys.forEach(k => {
    const list = d.slots.filter(x => x.session === k);
    const open = d.plan.sessions.indexOf(k) >= 0;
    if (!open) return;
    const c = S.settings.sessions[k];
    h += `<div class="sess">${esc(SN(k))} ${c.open}〜${c.close}</div>`;
    list.forEach(x => {
      const tent = x.tentative || 0;
      const conf = Math.max(0, x.used - tent);
      const w1 = Math.min(100, Math.round(conf / d.seats * 100));
      const w2 = Math.min(100 - w1, Math.round(tent / d.seats * 100));
      const left = Math.max(0, d.seats - x.used);
      const label = x.stopped ? '受付停止' : left <= 0 ? '満席' : x.used + '名 残り' + left;
      h += `<div class="row ${x.stopped ? 'stopped' : ''}"><span>${x.time}</span><div class="track" data-g="x"><div class="f ok" style="width:${w1}%"></div><div class="f tent" style="width:${w2}%"></div></div><span class="r ${left <= 0 && !x.stopped ? 'full' : ''}">${label}${tent ? `<span class="tentn">（仮${tent}）</span>` : ''}</span></div>`;
    });
  });
  if (!h) return '<div class="sub">この日は休みです。</div>';
  return `<div data-grow="bars:${S.tab}:${d.date}:${d.slots.map(x => x.used).join('')}">` + h + '</div>' + `<div class="legend"><span><i style="background:var(--green)"></i>確定・押さえ</span><span><i class="tentlg"></i>仮押さえ（返事待ち・提案中・変更申込中）</span><span><i style="background:repeating-linear-gradient(45deg,var(--line) 0 4px,var(--bg) 4px 8px)"></i>受付停止</span></div>`;
}

// 予約タブで選んでいる日のデータ（まだ届いていなければ、いつもの営業から作った仮のもの）
function curDay() {
  if (S.dayData) return S.dayData;
  return { date: S.day, plan: dayPlan(S.day, {}, S.settings), slots: [], seats: S.settings.seats, reservations: [], blocks: [], changes: [], pending: true };
}

function weekHtml() {
  const base = S.day;
  const start = addDays(base, -weekday(base));
  let h = `<div class="row" style="justify-content:space-between"><b>${base.slice(0, 4)}年${Number(base.slice(5, 7))}月</b><button class="btn ghost small" data-act="calToggle">月で見る ›</button></div><div class="week" data-mg="week" data-mgs=".wd.sel">
    <button class="nav" data-act="week" data-d="-7" aria-label="前の週">${icon('i-left')}</button>`;
  for (let i = 0; i < 7; i++) {
    const date = addDays(start, i);
    const m = S.monthCache[date.slice(0, 7)];
    const info = m ? m.days.find(x => x.date === date) : null;
    const cls = !info ? '' : info.plan.kind !== 'open' ? 'off' : info.guests >= Math.ceil(S.settings.seats * 0.7) ? 'busy' : info.guests ? 'has' : '';
    h += `<button class="wd ${cls} ${date === S.day ? 'sel' : ''} ${date < today() ? 'past' : ''}" data-act="goDay" data-date="${date}">
      <div class="dn">${WD[i]}</div><div class="dd">${Number(date.slice(8))}</div><div class="pp">${!info ? '' : info.plan.kind !== 'open' ? '休' : date > bookingEnd(S.settings, today()) ? '受付前' : info.guests ? info.guests + '名' : '—'}</div></button>`;
  }
  h += `<button class="nav" data-act="week" data-d="7" aria-label="次の週">${icon('i-right')}</button></div>`;
  return h;
}

function monthHtml() {
  const m = S.monthData;
  const [y, mo] = S.day.slice(0, 7).split('-').map(Number);
  let cells = WD.split('').map(w => `<div class="wdh">${w}</div>`).join('') + '<div></div>'.repeat(weekday(S.day.slice(0, 7) + '-01'));
  const days = m ? m.days : Array.from({ length: new Date(Date.UTC(y, mo, 0)).getUTCDate() }, (_, i) => ({ date: S.day.slice(0, 7) + '-' + pad(i + 1), loading: true }));
  days.forEach(d => {
    if (d.loading) {
      cells += `<button class="day ${d.date < today() ? 'past' : ''} ${S.day === d.date ? 'sel' : ''}" data-act="goDay" data-date="${d.date}">${Number(d.date.slice(8))}<small></small><span class="n"></span></button>`;
      return;
    }
    const past = d.date < today();
    const closed = d.plan.kind !== 'open';
    const label = d.plan.kind === 'off' ? '休' : d.plan.kind === 'private' ? '貸切' : KEYS().filter(k => d.plan.sessions.indexOf(k) >= 0).map(k => esc(SHORT(k))).join('');

    const notyet = d.date > bookingEnd(S.settings, today());
    cells += `<button class="day ${past ? 'past' : ''} ${closed ? 'off' : busy} ${notyet ? 'notyet' : ''} ${d.plan.custom && S.day !== d.date ? 'ov' : ''} ${S.day === d.date ? 'sel' : ''}" data-act="goDay" data-date="${d.date}">
      ${Number(d.date.slice(8))}<small>${notyet && !closed ? '受付前' : label}</small><span class="n">${d.guests ? d.guests + '名' : ''}${d.blocks ? '・B' : ''}</span></button>`;
  });

      <button class="btn small iconbtn" data-act="month" data-d="-1" aria-label="前の月">${icon('i-left')}</button><b>${y}年${mo}月</b><button class="btn small iconbtn" data-act="month" data-d="1" aria-label="次の月">${icon('i-right')}</button>
      <button class="btn ghost small" data-act="calToggle">週で見る</button></div>
    <div class="cal" style="margin-top:8px" data-mg="cal:${S.day.slice(0, 7)}" data-mgs=".day.sel">${cells}</div>
    <div class="legend"><span>${KEYS().map(k => `<b>${esc(SHORT(k))}</b>＝${esc(SN(k))}`).join('　')}</span></div>
    <div class="legend"><span><i style="background:repeating-linear-gradient(45deg,var(--line) 0 3px,#fff 3px 6px)"></i>受付前（${jd(bookingEnd(S.settings, today()))}より後）</span><span><i style="background:var(--gray-l)"></i>休み</span><span><i style="background:var(--green-l)"></i>予約あり</span><span><i style="background:var(--amber-l)"></i>混み合う日</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--red)"></i>いつもと違う日</span><span>B＝押さえあり</span></div>`;
}

function dayList(d) {
  if (!d.reservations.length) return '<div class="sub">この日の予約はまだありません。</div>';
  return d.reservations.map(r => {
    const t = r.status === '提案中' ? r.offerTime : r.time;
    const open = S.cancelFor === r.id;
    const editing = S.edit && S.edit.id === r.id;
    const busy = open || editing;
    const chg = (d.changes || []).find(c => c.resId === r.id);
    return `<div class="res ${r.status === 'キャンセル' ? 'canceled' : ''}">
      <div class="t">${esc(t)}${r.until ? `<small>〜${esc(r.until)}</small>` : ''}</div>
      <div><div class="n">${custLink(r)} <span class="g">${r.guests}名</span> ${visitTag(r)}</div>
        <div class="d">${esc(r.course)}${r.source && r.source !== 'LINE' ? '・' + esc(r.source) : ''}${r.phone ? `・<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>` : ''}</div>
        <div class="d">${statusTag(r.status)}${chg ? ` <span class="tag amber">変更申込中 → ${jd(chg.date)} ${esc(chg.time)} ${chg.guests}名</span>` : ''}${r.arrived === 'yes' ? ' <span class="tag gray">来店済み</span>' : r.arrived === 'no' ? ' <span class="tag gray">来店なし</span>' : ''}</div>
        ${noteTags(r)}</div>
      <div class="act">${r.status !== 'キャンセル' && !busy ? `${r.status === '確定' ? `<button class="btn small" data-act="edit" data-id="${esc(r.id)}">変更</button>` : ''}<button class="btn small" data-act="cancel" data-id="${esc(r.id)}">取消</button>` : ''}</div>

  }).join('');
}

// 席を押さえる（電話・DM）と受付停止をひとつの入力にまとめる
function holdForm() {
  const slots = openSlotsOfDay();
  const list = slots.length ? slots : KEYS().map(k => sessionSlots(S.settings, k)).flat();
  const H = S.hold || (S.hold = { time: list[0] ? list[0].time : '18:00', guests: 2, source: '電話', name: '', note: '', all: false });
  const seen = {};
  const times = list.filter(x => !seen[x.time] && (seen[x.time] = true));
  const d = curDay();
  const info = d.slots.find(x => x.time === H.time);
  const left = d.pending ? '確認中…' : (info ? Math.max(0, d.seats - info.used) : d.seats) + '席';
  const quick = [today(), addDays(today(), 1)];
  return `<div class="panel" id="holdForm">
    <label class="f" style="margin-top:0">日付</label>
    <div class="row" style="flex-wrap:wrap" data-mg="hdate" data-mgs=".chip.on">${quick.map((q, i) => `<button class="chip ${S.day === q ? 'on' : ''}" data-act="holdDate" data-v="${q}">${i === 0 ? '今日' : '明日'} ${jd(q)}</button>`).join('')}
      ${quick.indexOf(S.day) < 0 ? `<button class="chip on">${jd(S.day)}</button>` : ''}
      <input type="date" id="hDate" value="${S.day}" style="width:auto;padding:5px 8px;font-size:14px;margin-bottom:6px" aria-label="ほかの日付"></div>
    <label class="f">時間</label>
    <div data-mg="htime:${S.day}" data-mgs=".chip.on">${times.map(x => `<button class="chip ${H.time === x.time ? 'on' : ''}" data-act="holdTime" data-v="${x.time}">${x.time}</button>`).join('')}</div>
    <div class="sub">${jd(S.day)} ${H.time}の空き：${left}</div>
    ${(() => {
      const k = sessionFor(S.day, H.time, {}, S.settings) || KEYS()[0];
      const base = S.settings.sessions[k] ? Number(S.settings.sessions[k].stay) : 120;
      const start = toMin(H.time);
      const defUntil = toHM(Math.min(start + base, 1439));
      if (!H.until || toMin(H.until) <= start) H.until = defUntil;
      const opts = [];
      for (let m = start + 30; m <= Math.min(start + 360, 1439); m += 30) opts.push(toHM(m));
      if (opts.indexOf(defUntil) < 0) opts.push(defUntil);
      opts.sort();
      return `<label class="f" for="hUntil">何時まで</label>
        <select id="hUntil">${opts.map(t => `<option value="${t}" ${H.until === t ? 'selected' : ''}>${t}まで（${durText(toMin(t) - start)}${t === defUntil ? '・いつも' : ''}）</option>`).join('')}</select>
        <div class="sub">いつもは${esc(SN(k))}の滞在時間（${base}分）で押さえます。長く・短く押さえたいときに変えてください。</div>`;
    })()}
    <label class="f">人数</label>
    <div class="stepper"><button data-act="holdG" data-d="-1">−</button><span class="n">${H.guests}</span>名<button data-act="holdG" data-d="1">＋</button>
      <label class="row" style="margin-left:auto;font-size:12px"><input type="checkbox" id="hAll" ${H.all ? 'checked' : ''}> 全席（貸切）</label></div>
    <label class="f">どこから</label>
    <div data-mg="hsrc" data-mgs=".chip.on">${['電話', 'Instagram', '店頭', 'その他'].map(v => `<button class="chip ${H.source === v ? 'on' : ''}" data-act="holdSrc" data-v="${v}">${v}</button>`).join('')}</div>
    <div class="grid2">
      <div><label class="f" for="hName">お名前（省略可）</label><input id="hName" type="text" value="${esc(H.name)}" placeholder="例）田村 様"></div>
      <div><label class="f" for="hPhone">電話番号（省略可）</label><input id="hPhone" type="tel" inputmode="tel" value="${esc(H.phone || '')}" placeholder="090-…"></div>
    </div>
    <div class="sub">お名前か電話番号があると、リピートのお客様として数えます。</div>
    <label class="f" for="hNote">メモ</label><input id="hNote" type="text" value="${esc(H.note)}" placeholder="例）窓側希望、法事の会食">
    <p class="err" id="hErr" role="alert"></p>
    <div class="grid2"><button class="btn" data-act="addToggle">やめる</button><button class="btn primary" data-act="holdSave">押さえる</button></div>
    <div class="sub" style="text-align:center;margin-top:6px">ネット予約の空き状況にすぐ反映されます</div>
  </div>`;
}

// 時間を指定して受付を止める（押した時間の枠だけ止める。もう一度押すと戻る）
function slotStopHtml(d) {
  const stops = d.blocks.filter(b => b.type === 'stop');
  const openKeys = KEYS().filter(k => d.plan.sessions.indexOf(k) >= 0);
  const isToday = d.date === today();
  const nowT = S.now.slice(11, 16);
  const seen = {};
  const rows = openKeys.map(k => {
    const c = S.settings.sessions[k];
    const times = sessionSlots(S.settings, k).map(x => x.time).filter(t => !seen[t] && (seen[t] = true));
    if (!times.length) return '';
    return `<div class="ecrow"><span class="eclabel">${esc(SN(k))}</span><div class="ecchips">${times.map(t => {
      const end = toHM(toMin(t) + Number(c.interval || 30));
      const own = stops.find(b => b.start === t && b.end === end);
      const covered = stops.find(b => b.start <= t && t < b.end);
      const past = isToday && t <= nowT;
      if (own) return `<button class="chip red" data-act="unstopSlot" data-id="${esc(own.id)}" aria-pressed="true">${t} 停止中</button>`;
      if (covered) return `<button class="chip" disabled style="opacity:.5">${t} 停止中</button>`;
      return `<button class="chip" data-act="stopSlot" data-v="${t}" data-end="${end}" ${past ? 'disabled style="opacity:.4"' : ''}>${t}</button>`;
    }).join('')}</div></div>`;
  }).join('');
  return `<label class="f">時間を指定して受付を止める（押した時間のネット予約だけ止めます。もう一度押すと戻ります）</label>
    ${rows}
    <div class="sub" style="margin-top:4px">例：12:00に3名の予約が入ったので、準備のために11:30の予約を受けたくない → 11:30を押す。</div>`;
}

// 早じまい（この時間から受付停止）：時間帯ごとに止める
function earlyCloseHtml(d) {
  const stops = d.blocks.filter(b => b.type === 'stop');
  const isToday = d.date === today();
  const nowT = S.now.slice(11, 16);
  const stopped = t => stops.some(b => b.start <= t && t < b.end);
  const openKeys = KEYS().filter(k => d.plan.sessions.indexOf(k) >= 0);
  const seen = {};
  let rows = '';
  openKeys.forEach(k => {
    const c = S.settings.sessions[k];
    const times = sessionSlots(S.settings, k).map(x => x.time).filter(t => !seen[t] && (seen[t] = true));
    // この時間を含む時間帯のうち、いちばん遅い閉店時刻まで止める
    const endFor = t => openKeys.filter(x => sessionSlots(S.settings, x).some(y => y.time === t))
      .map(x => S.settings.sessions[x].close).sort().pop() || c.close;
    const cand = times.filter(t => (!isToday || t > nowT) && !stopped(t));
    const nowIn = isToday && nowT >= c.first && nowT < c.close && !stopped(nowT) && times.some(t => t > nowT);
    if (!cand.length && !nowIn) {
      rows += `<div class="ecrow"><span class="eclabel">${esc(SN(k))}</span><span class="sub">${times.some(stopped) ? '受付を止めています' : '止められる時間がありません'}</span></div>`;
      return;
    }
    rows += `<div class="ecrow"><span class="eclabel">${esc(SN(k))}<br><span class="sub">${c.open}〜${c.close}</span></span><div class="ecchips">
      ${nowIn ? `<button class="chip red" data-act="stopFrom" data-v="${nowT}" data-end="${c.close}" data-label="${esc(SN(k))}">今から</button>` : ''}
      ${cand.map(t => `<button class="chip" data-act="stopFrom" data-v="${t}" data-end="${endFor(t)}" data-label="${esc(SN(k))}">${t}〜</button>`).join('')}</div></div>`;
  });
  const all = openKeys.map(k => sessionSlots(S.settings, k)).flat().map(x => x.time).filter(t => (!isToday || t > nowT) && !stopped(t)).sort();
  return `<label class="f">早じまい（その時間帯の、この時間からネット予約を止める）</label>
    ${stops.filter(b => b.memo !== '時間指定で停止').map(b => `<div class="row" style="margin-bottom:6px"><span class="tag red">受付停止</span><span>${b.start}〜${b.end === '23:59' ? '閉店' : b.end}${b.memo ? '　' + esc(b.memo) : ''}</span><button class="btn small danger" data-act="delBlock" data-id="${esc(b.id)}" style="margin-left:auto;white-space:nowrap;flex-shrink:0">解除</button></div>`).join('')}
    ${rows}
    ${all.length ? `<button class="btn small" data-act="stopFrom" data-v="${isToday && nowT < all[0] ? nowT : all[0]}" data-end="23:59" data-label="この日の残り" style="margin-top:4px">この日の残りをすべて止める</button>` : ''}`;
}

}

function editChanged(r, e) {
  const c = e.courseId ? S.courses.find(x => x.id === e.courseId) : null;
  const courseName = c ? c.name : '当日決定';
  return e.date !== r.date || e.time !== r.time || Number(e.guests) !== Number(r.guests) || courseName !== r.course;
}

function editText(r, e) {
  const c = e.courseId ? S.courses.find(x => x.id === e.courseId) : null;
  const courseName = c ? c.name : '当日決定';
  const name = (e.name || r.name).trim();
  return name + ' 様\n\nいつもありがとうございます。\nご予約の内容を、下記のとおり変更いたしました。\n\n' +
    '【変更前】\n日時：' + jdLong(r.date) + ' ' + r.time + '\n人数：' + r.guests + '名\nメニュー：' + r.course + '\n\n' +

}

  return `<div class="panel" id="editPanel">

    <label class="f" for="ePhone">電話番号</label><input id="ePhone" type="tel" data-e="phone" value="${esc(e.phone)}">
    <label class="f" for="eNote">ご要望・メモ</label><input id="eNote" type="text" data-e="note" value="${esc(e.note)}">
    ${r.hasLine ? (changed ? `
      <label class="f" for="eText">お客様にLINEで送る文面（自由に直せます）</label>
      <textarea id="eText" rows="12" data-e="text">${esc(e.text)}</textarea>

async function saveEdit(b, force) {
  const e = S.edit;
  const r = S.dayData.reservations.find(x => x.id === e.id);
  const err = $('eErr');
  if (!e.date || !e.time) { err.textContent = '日付と時間を選んでください。'; return; }
  if (!(Number(e.guests) >= 1)) { err.textContent = '人数を入力してください。'; return; }
  if (!e.name.trim()) { err.textContent = 'お名前を入力してください。'; return; }
  const changed = editChanged(r, e);
  if (r.hasLine && changed && !e.text.trim()) { err.textContent = 'お客様に送る文面を入力してください。'; return; }
  if (!force && !confirm(r.hasLine && changed ? '予約を変更して、お客様にLINEでお知らせします。よろしいですか？' : '予約を変更します。よろしいですか？')) return;
  const mo = M.busy(b);
  try {
    const res = await api('edit', {
      id: e.id, updatedAt: r.updatedAt, date: e.date, time: e.time, guests: e.guests, courseId: e.courseId,
      name: e.name, phone: e.phone, note: e.note, text: r.hasLine && changed ? e.text : '', force: force
    });
    if (res.confirm) {
      mo.fail();
      if (confirm(res.message)) await saveEdit(b, true);
      return;
    }
    await mo.ok();
    S.edit = null;
    toast(res.sent ? '変更して、LINEでお知らせしました' : '変更しました');
    staleMonths();
    if (res.date !== S.day) goDay(res.date, true); else { refresh(); reload(); }
  } catch (ex) {
    mo.fail();
    err.textContent = ex.message;
  }
}

async function addDirect(b, force) {
  const sel = $('aCourse');
  const body = {
    date: S.day, time: $('aTime').value, guests: $('aGuests').value, name: $('aName').value,
    phone: $('aPhone').value, source: $('aSource').value, courseId: sel.value,
    courseName: sel.value ? sel.options[sel.selectedIndex].text : '', note: $('aNote').value, force: force
  };
  if (!body.name.trim()) { $('addErr').textContent = 'お名前を入力してください。'; return; }
  if (!(Number(body.guests) >= 1)) { $('addErr').textContent = '人数を入力してください。'; return; }
  b.disabled = true;
  try {

    if (res.full) {
      b.disabled = false;
      if (confirm(res.message)) await addDirect(b, true);
      return;
    }
    S.addOpen = false;
    toast('予約を追加しました');

    refresh();
    reload();
  } catch (e) { $('addErr').textContent = e.message; b.disabled = false; }
}

// 受付停止・押さえを、保存を待たずに手元の表示へ反映する（保存が終わったら取り直して正しい数字にする）
function markStops(d) {
  const stops = d.blocks.filter(x => x.type === 'stop');
  d.slots.forEach(x => { x.stopped = stops.some(s => s.start <= x.time && x.time < s.end); });
}
function addLocalStop(d, start, end, memo) {
  const blk = { id: 'new-' + Date.now(), date: d.date, type: 'stop', start: start, end: end, seats: null, memo: memo };
  d.blocks = d.blocks.concat(blk).sort((x, y) => x.start.localeCompare(y.start));
  markStops(d);
  return blk;
}
function removeLocalBlock(d, blk) {
  d.blocks = d.blocks.filter(x => x !== blk);
  markStops(d);
}
// 受付停止を足す（保存が終わったら、本当の番号に置き換える）
async function stopLocal(d, start, end, memo, done) {
  const blk = addLocalStop(d, start, end, memo);
  S.planOpen = true;
  refresh();
  try {
    await save(() => api('addBlock', { date: d.date, type: 'stop', start: start, end: end, memo: memo }).then(r => { if (r.id) blk.id = r.id; }));
    toast(done);
  } catch (e) { fail(e); }
  staleMonths();
  reload();
}
async function unblockLocal(d, id, done) {
  const blk = d.blocks.find(x => x.id === id);
  if (!blk) return;
  removeLocalBlock(d, blk);
  refresh();
  // 足したばかりの停止は、保存が終わって番号が決まってから消す
  try { await save(() => api('deleteBlock', { id: blk.id })); toast(done); } catch (e) { fail(e); }
  staleMonths();
  reload();
}

ACTIONS.book = async (a, b) => {
  const d = S.dayData;
  if (a === 'openCustFrom') { openCustFrom(b.dataset.key); return; }
  if (a === 'goDay') goDay(b.dataset.date);
  else if (a === 'week') goDay(addDays(S.day, Number(b.dataset.d)));
  else if (a === 'month') {
    const [y, m] = S.day.slice(0, 7).split('-').map(Number);
    const nd = new Date(Date.UTC(y, m - 1 + Number(b.dataset.d), 1));
    goDay(nd.getUTCFullYear() + '-' + pad(nd.getUTCMonth() + 1) + '-01');
  }
  else if (a === 'calToggle') { S.calOpen = !S.calOpen; refresh(); }
  else if (a === 'addToggle') { S.addOpen = !S.addOpen; S.planOpen = false; if (S.addOpen) S.hold = null; refresh(); }
  else if (a === 'planToggle') { S.planOpen = !S.planOpen; S.addOpen = false; refresh(); }
  else if (a === 'holdDate') { readHold(); goDayKeep(b.dataset.v, S.hold); }
  else if (a === 'holdTime') { readHold(); S.hold.time = b.dataset.v; S.hold.until = ''; refresh(); }
  else if (a === 'holdG') { readHold(); S.hold.guests = Math.max(1, Math.min(200, S.hold.guests + Number(b.dataset.d))); refresh(); }
  else if (a === 'holdSrc') { readHold(); S.hold.source = b.dataset.v; refresh(); }
  else if (a === 'holdSave') await saveHold(b, false);
  else if (a === 'cancel') { S.cancelFor = b.dataset.id; S.edit = null; refresh(); }
  else if (a === 'cancelClose') { S.cancelFor = ''; refresh(); }
  else if (a === 'cancelDo') {
    const notify = $('cNotify') && $('cNotify').checked;
    const text = notify ? $('cText').value.trim() : '';
    if (notify && !text) { $('cErr').textContent = 'お知らせする文面を入力してください。'; return; }
    if (!confirm(notify ? '取り消して、お客様にLINEでお知らせします。よろしいですか？' : '取り消します。よろしいですか？')) return;
    const mo = M.busy(b);
    try {
      await api('cancel', { id: b.dataset.id, text: text });
      staleMonths();
      await afterSave(mo);
      S.cancelFor = '';
      toast('取り消しました');
      refresh();
    }
    catch (e) { mo.fail(); $('cErr').textContent = e.message; }
  }
  else if (a === 'edit') {
    const r = d.reservations.find(x => x.id === b.dataset.id);
    S.cancelFor = '';
    S.edit = { id: r.id, date: r.date, time: r.time, guests: r.guests, courseId: r.courseId || '', name: r.name, phone: r.phone || '', note: r.note || '', text: '', edited: false };
    refresh();
    const el = $('editPanel'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  else if (a === 'editClose') { S.edit = null; refresh(); }
  else if (a === 'editResetText') { S.edit.edited = false; refresh(); }
  else if (a === 'editSave') await saveEdit(b, false);
  else if (a === 'stopSlot') await stopLocal(d, b.dataset.v, b.dataset.end, '時間指定で停止', b.dataset.v + ' の受付を止めました');
  else if (a === 'unstopSlot') await unblockLocal(d, b.dataset.id, '受付を再開しました');
  else if (a === 'stopFrom') {
    const t = b.dataset.v;
    const end = b.dataset.end || '23:59';
    const who = b.dataset.label || '';
    const msg = end === '23:59' ? (t === S.now.slice(11, 16) ? '今' : t) + 'から、この日の残りのネット予約をすべて止めます。'
      : who + 'の ' + (t === S.now.slice(11, 16) ? '今' : t) + '〜' + end + ' のネット予約を止めます。ほかの時間帯はそのまま受け付けます。';
    if (!confirm(msg + 'よろしいですか？')) return;
    await stopLocal(d, t, end, '早じまい' + (who && end !== '23:59' ? '（' + who + '）' : ''), '受付を止めました');
  }
  else if (a === 'delBlock') {
    if (!confirm('この押さえ（停止）を解除しますか？')) return;
    await unblockLocal(d, b.dataset.id, '解除しました');
  }
  else if (a === 'upcoming') {
    if (S.upcoming) { S.upcoming = null; refresh(); return; }
    try { S.upcoming = (await api('upcoming')).list; refresh(); } catch (e) { fail(e); }
  }
  else if (a === 'session' || a === 'kind' || a === 'revert') {
    let body;
    if (a === 'revert') body = { date: d.date, revert: true };
    else if (a === 'kind') body = { date: d.date, kind: d.plan.kind === b.dataset.kind ? 'open' : b.dataset.kind, sessions: d.plan.kind === b.dataset.kind ? KEYS() : [] };
    else {
      const cur = d.plan.kind === 'open' ? d.plan.sessions.slice() : [];
      const k = b.dataset.k;
      const next = cur.indexOf(k) >= 0 ? cur.filter(x => x !== k) : cur.concat(k);
      body = { date: d.date, kind: next.length ? 'open' : 'off', sessions: next };
    }
    // 営業の切り替えは押したらすぐ表示を変え、裏で保存する
    d.plan = body.revert ? dayPlan(d.date, {}, S.settings)
      : { kind: body.kind, sessions: body.kind === 'open' ? KEYS().filter(k => body.sessions.indexOf(k) >= 0) : [], custom: true };
    const md = S.monthData && S.monthData.days.find(x => x.date === d.date);
    if (md) md.plan = d.plan;
    S.planOpen = true;
    refresh();
    try {
      const res = await save(() => api('setDay', body));
      S.calWarn = res.warning || '';
      toast('営業日を変更しました');
    } catch (e) { fail(e); }
    staleMonths();
    reload();
  }
};

// 押さえる入力を開いたまま、別の日に移る
async function goDayKeep(date, H) {
  S.day = date; S.cancelFor = ''; S.edit = null; S.planOpen = false;
  S.addOpen = true;
  S.hold = Object.assign({}, H);
  refresh();
  await reload();
  const slots = openSlotsOfDay();
  if (S.hold && !slots.some(x => x.time === S.hold.time)) { S.hold.time = slots[0] ? slots[0].time : S.hold.time; refresh(); }
}

// 90 → 「1時間30分」、30 → 「30分」
function durText(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return (h ? h + '時間' : '') + (m ? m + '分' : '');
}

function nextSlotTime() {
  const slots = openSlotsOfDay();
  const nowT = S.day === today() ? S.now.slice(11, 16) : '00:00';
  const n = slots.find(x => x.time >= nowT);
  return n ? n.time : (slots[0] ? slots[0].time : '18:00');
}

function readHold() {
  const H = S.hold; if (!H) return;
  if ($('hName')) H.name = $('hName').value;
  if ($('hPhone')) H.phone = $('hPhone').value;
  if ($('hUntil')) H.until = $('hUntil').value;
  if ($('hNote')) H.note = $('hNote').value;
  if ($('hAll')) H.all = $('hAll').checked;
}

async function saveHold(b, force) {
  readHold();
  const H = S.hold;
  const err = $('hErr');
  const mo = M.busy(b);
  try {
    if (H.all) {
      const c = S.settings.sessions[sessionFor(S.day, H.time, {}, S.settings) || KEYS()[0]];
      const end = H.until || toHM(Math.min(toMin(H.time) + Number(c ? c.stay : 120), 1439));
      await api('addBlock', { date: S.day, type: 'seats', start: H.time, end: end, allSeats: true, memo: [H.source, H.name, H.note].filter(Boolean).join(' ') });
      toast('全席を押さえました');
    } else {
      const res = await api('addPhone', { date: S.day, time: H.time, until: H.until || '', guests: H.guests, name: H.name || H.source + 'の予約', phone: H.phone || '', source: H.source, courseId: '', courseName: '', note: H.note, force: force });
      if (res.full) { mo.fail(); if (confirm(res.message)) await saveHold(b, true); return; }
      toast('席を押さえました');
    }
    staleMonths();
    await afterSave(mo);
    S.addOpen = false; S.hold = null;
    refresh();
  } catch (e) { mo.fail(); err.textContent = e.message; }
}

function mergePicker(c) {
  const q = foldName(S.mergeQ || '');
  const cand = (S.custList || []).filter(x => x.key !== c.key && (!q || foldName(x.name).indexOf(q) >= 0 || x.phone.indexOf(S.mergeQ.replace(/[^\d]/g, '') || '@') >= 0)).slice(0, 8);
  return `<div class="panel">
    <input id="mergeQ" type="search" value="${esc(S.mergeQ)}" placeholder="まとめたいお客様の名前・電話番号">
    ${cand.map(x => `<div class="row" style="margin-top:8px"><span style="flex:1;min-width:0">${esc(x.name)} <span class="sub">${x.phone ? esc(x.phone) : '電話番号なし'}・${x.total}回</span></span>
      <button class="btn small primary" data-act="mergePick" data-from="${esc(x.key)}" data-name="${esc(x.name)}">まとめる</button></div>`).join('') || '<div class="sub" style="margin-top:8px">見つかりません。</div>'}
    <button class="btn small ghost" data-act="mergeClose" style="margin-top:6px">やめる</button>
  </div>`;
}

// 表記ゆれの候補探し（かな・カナ・空白・様の違いを無視）
function foldName(v) {
  return String(v || '').normalize('NFKC').replace(/\s/g, '').replace(/(様|さま|さん)$/, '')
    .replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)).toLowerCase();
}

// お客様を開く（一覧の位置は覚えておき、一覧に戻ったときに戻す）
function openCust(key) {
  if (!S.custSel) S.scroll.custList = window.scrollY;
  S.custSel = key; S.memoEdit = false; S.mergeOpen = false;
  refresh();
  window.scrollTo(0, 0);
  return reload();
}
function closeCust() {
  S.custSel = null; S.mergeOpen = false; S.memoEdit = false;
  refresh();
  window.scrollTo(0, S.scroll.custList || 0);
  return reload();
}

ACTIONS.cust = async (a, b) => {
  if (a === 'custFilter') { S.custFilter = b.dataset.v; refresh(); }
  else if (a === 'openCust') openCust(b.dataset.key);
  else if (a === 'closeCust') closeCust();
  else if (a === 'custAddOpen') { S.custAdd = { name: '', tel: '', memo: '', extra: 0 }; refresh(); setTimeout(() => $('caName') && $('caName').focus(), 50); }
  else if (a === 'custAddClose') { S.custAdd = null; refresh(); }
  else if (a === 'caExtra') { readCustAdd(); S.custAdd.extra = Math.max(0, S.custAdd.extra + Number(b.dataset.d)); refresh(); }
  else if (a === 'custAddSave') {
    readCustAdd();
    const f = S.custAdd;
    if (!f.name.trim()) { $('caErr').textContent = 'お名前を入力してください。'; return; }
    const mo = M.busy(b);
    try {
      const res = await api('addCustomer', f);
      if (res.exists) {
        mo.fail();
        if (confirm(res.message + '\n登録済みのお客様を開きますか？')) { S.custAdd = null; openCust(res.key); }
        return;
      }
      await mo.ok();
      S.custAdd = null; toast('追加しました'); openCust(res.key);
    } catch (e) { mo.fail(); $('caErr').textContent = e.message; }
  }
  else if (a === 'extra') {
    const c = S.custDetail;
    const next = Math.max(0, c.extra + Number(b.dataset.d));
    if (next === c.extra) return;
    c.extra = next; c.total = c.visits + next; refresh();
    clearTimeout(S.extraTimer);
    S.extraTimer = setTimeout(async () => {
      try {
        await api('saveCustomer', { key: c.key, extra: c.extra });
        const row = (S.custList || []).find(x => x.key === c.key);
        if (row) { row.extra = c.extra; row.total = row.visits + c.extra; }
        toast('来店回数を保存しました');
      } catch (e) { fail(e); }
    }, 500);
  }
  else if (a === 'memoEdit') { S.memoEdit = true; refresh(); }
  else if (a === 'memoCancel') { S.memoEdit = false; refresh(); }
  else if (a === 'memoSave') {
    const mo = M.busy(b);
    const c = S.custDetail, memo = $('memoText').value;
    try {
      await api('saveCustomer', { key: c.key, memo: memo });
      await mo.ok();
      // 保存した内容を手元にも反映する（取り直さない）
      c.memo = memo.trim();
      const row = (S.custList || []).find(x => x.key === c.key);
      if (row) row.memo = c.memo;
      S.memoEdit = false; toast('保存しました'); refresh();
    }
    catch (e) { mo.fail(); fail(e); }
  }
  else if (a === 'saveProfile') {
    const mo = M.busy(b);
    try { await api('saveCustomer', { key: S.custDetail.key, name: $('cdName').value, tel: $('cdTel').value }); await afterSave(mo); toast('保存しました'); refresh(); }
    catch (e) { mo.fail(); fail(e); }
  }
  else if (a === 'mergeOpen') {
    S.mergeOpen = true; S.mergeQ = '';
    if (!S.custList) { try { const r = await api('customers', {}); S.custList = r.customers; S.custTotal = r.total; S.dupes = r.dupes || []; } catch (e) { fail(e); } }
    refresh(); setTimeout(() => $('mergeQ') && $('mergeQ').focus(), 50);
  }
  else if (a === 'mergeClose') { S.mergeOpen = false; refresh(); }
  else if (a === 'mergePick') {
    const c = S.custDetail;
    if (!confirm('「' + b.dataset.name + '」を「' + c.name + '」にまとめます。\n来店回数とメモも合わさります。よろしいですか？')) return;
    try { await api('mergeCustomers', { from: b.dataset.from, into: c.key }); S.mergeOpen = false; toast('まとめました'); refresh(); reload(); }
    catch (e) { fail(e); }
  }
  else if (a === 'mergeDupe') {
    const froms = b.dataset.from.split('|');
    if (!confirm(froms.length + 1 + '件を1人のお客様にまとめます。よろしいですか？')) return;
    try {
      for (const f of froms) await api('mergeCustomers', { from: f, into: b.dataset.into });
      toast('まとめました'); reload();
    } catch (e) { fail(e); }
  }
  else if (a === 'unmerge') {
    if (!confirm('まとめたお客様を元に戻しますか？\n（合わさったメモと来店回数は、このお客様に残ります）')) return;
    try { await api('unmergeCustomer', { key: b.dataset.key }); toast('元に戻しました'); reload(); }
    catch (e) { fail(e); }
  }
};

// メニューの保存（続けて押したときは、最後の保存の結果だけを表示に使う。失敗したら取り直す）
async function saveCourses(fn) {
  const seq = S.courseSeq = (S.courseSeq || 0) + 1;
  try {
    const res = await save(fn);
    if (seq === S.courseSeq) { S.courses = res.courses; refresh(); }
    return true;
  } catch (e) {
    fail(e);
    try { S.courses = (await api('courses')).courses; refresh(); } catch (e2) { /* 表示はそのまま */ }
    return false;
  }
}

ACTIONS.menu = async (a, b) => {
  const id = b.dataset.id;
  try {
    if (a === 'new') {
      S.editCourse = { name: '', price: '', price_type: 'fixed', description: '', sessions: ['dinner'], weekdays: [0, 1, 2, 3, 4, 5, 6], min_guests: 1, cutoff_mode: 'default', cutoff_days: S.settings.cutoff.days, cutoff_time: S.settings.cutoff.time, chg_mode: 'default', chg_days: S.settings.changeCutoff.days, chg_time: S.settings.changeCutoff.time };
      refresh();
    } else if (a === 'edit') {
      S.editCourse = JSON.parse(JSON.stringify(S.courses.find(c => c.id === id)));
      refresh();
    } else if (a === 'close') {
      S.editCourse = null; refresh();
    } else if (a === 'cSession' || a === 'cDay' || a === 'cMode' || a === 'cChgMode') {
      const c = readCourseForm();
      if (a === 'cSession') { const k = b.dataset.k; c.sessions = c.sessions.indexOf(k) >= 0 ? c.sessions.filter(x => x !== k) : c.sessions.concat(k); }
      if (a === 'cDay') { const d = Number(b.dataset.d); c.weekdays = c.weekdays.indexOf(d) >= 0 ? c.weekdays.filter(x => x !== d) : c.weekdays.concat(d).sort(); }
      if (a === 'cMode') c.cutoff_mode = b.value;
      if (a === 'cChgMode') c.chg_mode = b.value;
      refresh();
    } else if (a === 'up' || a === 'down') {
      // 並べ替えと表示の切り替えは、押したらすぐ表示を変え、裏で保存する
      const i = S.courses.findIndex(x => x.id === id), j = i + (a === 'up' ? -1 : 1);
      if (i < 0 || j < 0 || j >= S.courses.length) return;
      const list = S.courses.slice();
      list[i] = S.courses[j]; list[j] = S.courses[i];
      S.courses = list;
      refresh();
      await saveCourses(() => api('moveCourse', { id: id, dir: a === 'up' ? -1 : 1 }));
    } else if (a === 'toggle') {
      const vis = !S.courses.find(x => x.id === id).visible;
      S.courses = S.courses.map(x => (x.id === id ? Object.assign({}, x, { visible: vis }) : x));
      refresh();
      if (await saveCourses(() => api('toggleCourse', { id: id, visible: vis }))) toast(vis ? '予約ページに表示しました' : '予約ページから隠しました');
    } else if (a === 'saveCourse') {
      const c = readCourseForm();
      if (!c.name.trim()) { $('cErr').textContent = 'メニュー名を入力してください。'; return; }
      if (c.price === '' || Number(c.price) < 0) { $('cErr').textContent = '料金を入力してください。'; return; }
      if (!c.sessions.length) { $('cErr').textContent = '選べる時間帯を1つ以上選んでください。'; return; }
      if (!c.weekdays.length) { $('cErr').textContent = '公開する曜日を1つ以上選んでください。'; return; }
      const mo = M.busy(b);
      try {
        S.courses = (await api('saveCourse', c)).courses;
        await mo.ok();
        S.editCourse = null;
        toast('保存しました');
        refresh();
      } catch (e) { mo.fail(); $('cErr').textContent = e.message; }
    } else if (a === 'delete') {
      if (!confirm('「' + S.editCourse.name + '」を削除しますか？\n来年も使う場合は、削除せずスイッチをオフにするのがおすすめです。')) return;
      const res = await api('deleteCourse', { id: S.editCourse.id });
      S.courses = res.courses;
      S.editCourse = null;
      toast(res.used ? '削除しました（このメニューの予約が' + res.used + '件あります。予約の表示は残ります）' : '削除しました');
      refresh();
    }
  } catch (e) { fail(e); }
};

];
const SRC_NAME = { google: 'Googleマップ', homepage: 'ホームページ', instagram: 'Instagram（プロフィール）', 'ig-story': 'Instagram（ストーリー）', richmenu: 'リッチメニュー', line: 'LINE（そのほか）', 'line-message': 'LINEのお知らせのボタン', web: 'ブラウザ', direct: '不明' };
// 数値から読み取れることを文章にする
function buildInsights(a) {
  const out = [];
  const pct = (x, y) => (y ? Math.round(x / y * 100) : 0);
  const f = a.funnel;
  const MIN = 10;
  if (a.totals.opens < MIN) {
    out.push({ tone: 'info', title: 'まだデータが少なめです',
      body: '予約ページが' + MIN + '回以上開かれると、傾向をもとにした気づきが増えます。今は数字の動きだけ見ておけば大丈夫です。', ref: '開かれた回数' });
  }
  // 1. 期間の前半と後半の比較
  if (a.daily.length >= 14) {
    const half = Math.floor(a.daily.length / 2);
    const prev = a.daily.slice(0, half).reduce((x, d) => x + d.opens, 0);
    const last = a.daily.slice(-half).reduce((x, d) => x + d.opens, 0);
    if (prev + last >= MIN && prev > 0) {
      const ch = Math.round((last - prev) / prev * 100);
      if (ch >= 30) out.push({ tone: 'good', title: '閲覧が増えています（+' + ch + '%）', body: '期間の後半は前半より' + ch + '%多く見られています。最近の投稿や告知が効いている可能性があります。何をしたかを振り返っておくと、次に活かせます。', ref: '日ごとの閲覧' });
      else if (ch <= -30) out.push({ tone: 'warn', title: '閲覧が減っています（' + ch + '%）', body: '期間の後半は前半より' + Math.abs(ch) + '%少なくなっています。SNSでの告知や、Googleマップの情報（営業時間・写真）を見直すきっかけにしてください。', ref: '日ごとの閲覧' });
    }
  }
  // 2. 予約までの割合
  if (f.open >= MIN) {
    const cv = pct(f.request, f.open);
    if (cv >= 30) out.push({ tone: 'good', title: '見た人の' + cv + '%がリクエストまで進んでいます', body: '予約ページの使いやすさや、空き状況は十分に機能しています。閲覧数そのものを増やす（告知・Googleマップの充実）のが効果的です。', ref: '予約までの流れ' });
    else if (cv < 10) out.push({ tone: 'warn', title: 'リクエストまで進む人が少なめです（' + cv + '%）', body: '見に来ているのに予約に至っていません。下の「離れている場所」と「満席・締切で選べなかった日」を合わせて見てください。', ref: '予約までの流れ' });
  }
  // 3. いちばん離れている場所
  if (f.open >= MIN) {
    const steps = [
      ['日付を選ぶ前', f.open, f.date, '空いている日が少ない、受付期間が短い、休みの日が多いなどが考えられます。受付の最終日を延ばす、営業日を見直すと改善しやすい場所です。'],
      ['時間を選ぶところ', f.date, f.time, '日付は選んだものの、希望の時間が満席や締切になっている可能性があります。混む時間帯の席数や、時間の枠（間隔）を見直す目安になります。'],
      ['メニューを選ぶところ', f.time, f.course, 'メニューで迷っている、または最少人数・締切の条件で選べない可能性があります。内容の説明や、価格の表示を見直すと効果が出やすい場所です。'],
      ['お客様情報の入力', f.course, f.request, '入力の手間や、LINEの友だち追加が必要なことが負担になっている可能性があります。初めての方が多い時期に起きやすい傾向です。']
    ].filter(x => x[1] >= 5);
    if (steps.length) {
      const worst = steps.map(x => ({ name: x[0], rate: x[2] / x[1], lost: x[1] - x[2], hint: x[3] })).sort((p, q) => p.rate - q.rate)[0];
      if (worst.rate < 0.6) out.push({ tone: 'warn', title: 'いちばん離れているのは「' + worst.name + '」です（' + worst.lost + '人）', body: worst.hint, ref: '予約までの流れ' });
    }
  }
  // 4. 満席・締切で選べなかった需要
  const blockedTotal = a.blockedWeekday.reduce((x, y) => x + y, 0);
  if (blockedTotal >= 3) {
    const wd = a.blockedWeekday.indexOf(Math.max(...a.blockedWeekday));
    const top = a.blocked[0];
    out.push({ tone: 'warn', title: '満席・締切で予約できなかった人がのべ' + blockedTotal + '人います',
      body: '特に' + WD[wd] + '曜日に集中しています' + (top ? '（いちばん多いのは' + jd(top.date) + '・' + top.users + '人）' : '') + '。この曜日は席の配分（電話・DM用の押さえを減らす）、時間帯の追加、締切の見直しで受けられる人が増える可能性があります。', ref: '満席・締切で選べなかった日' });
  }
  // 5. 来店したい曜日
  const wantTotal = a.wantWeekday.reduce((x, y) => x + y, 0);
  if (wantTotal >= MIN) {
    const order = a.wantWeekday.map((n, i) => [i, n]).sort((p, q) => q[1] - p[1]);
    out.push({ tone: 'info', title: '来店したい曜日は「' + WD[order[0][0]] + '曜日」が最多です', body: '日付を選んだ人の' + pct(order[0][1], wantTotal) + '%が' + WD[order[0][0]] + '曜日です' + (order[1][1] > 0 ? '（次は' + WD[order[1][0]] + '曜日）' : '') + '。仕込みや人手の配分、限定メニューを出す曜日の参考になります。', ref: 'よく見られている日' });
  }
  // 6. よく見られる時間帯（告知のタイミング）
  const hourTotal = a.hours.reduce((x, y) => x + y.n, 0);
  if (hourTotal >= MIN) {
    const h = a.hours.slice().sort((p, q) => q.n - p.n)[0];
    out.push({ tone: 'info', title: '予約ページがよく見られるのは' + h.h + '時台です', body: 'SNSの投稿やLINEでのお知らせは、この少し前（' + Math.max(0, h.h - 1) + '時台）に出すと目に留まりやすくなります。', ref: '日ごとの閲覧' });
  }
  // 7. 入口
  const srcTotal = a.sources.reduce((x, y) => x + y.users, 0);
  if (srcTotal >= 5) {
    const known = a.sources.filter(x => ['google', 'homepage', 'instagram', 'ig-story', 'richmenu'].indexOf(x.src) >= 0);
    if (!known.length) out.push({ tone: 'info', title: 'どこから来たかが、まだ分かれていません', body: '「URL・LINE」タブにある入口ごとのURLを、Googleマップ・ホームページ・Instagram・リッチメニューにそれぞれ貼ると、どの入口が効いているかが分かります。', ref: 'どこから来たか' });
    else {
      const top = a.sources[0];
      out.push({ tone: 'info', title: 'いちばん多い入口は「' + (SRC_NAME[top.src] || top.src) + '」です（' + pct(top.users, srcTotal) + '%）', body: 'この入口の情報（写真・営業時間・メニュー）を充実させると、効果が出やすくなります。少ない入口は、URLが貼られているか、目立つ位置にあるかを確認してください。', ref: 'どこから来たか' });
    }
  }
  // 8. 見られているのに予約が少ないメニュー
  const weak = a.courses.filter(c => c.users >= 5 && c.requests / c.users < 0.15).sort((p, q) => q.users - p.users)[0];
  if (weak) out.push({ tone: 'warn', title: '「' + weak.name + '」は見られているのにリクエストが少なめです', body: weak.users + '人が見て、リクエストは' + weak.requests + '件です。価格、内容の説明、最少人数や締切の条件が合っていない可能性があります。', ref: 'メニュー' });
  // 9. 迷っている人
  if (a.lookers.length) out.push({ tone: 'info', title: '何度も見ているのに予約していない人が' + a.lookers.length + '人います', body: '日程や内容で迷っている可能性があります。来店時やお問い合わせのときに、空き状況を案内するきっかけにしてください（自動でメッセージは送りません）。', ref: '同じ人が見た日数' });
  return out;
}

const IG_KIND = { feed: '投稿', reel: 'リール', story: 'ストーリー' };
function sum(list, k) { return list.reduce((a, x) => a + (Number(x[k]) || 0), 0); }
function avg(list, k) { const v = list.filter(x => x[k] !== null && x[k] !== undefined); return v.length ? sum(v, k) / v.length : 0; }
function daysSince(date) { return date ? diffDaysJs(date, today()) : null; }

function buildIgInsights(d) {
  const out = [];
  const media = d.media || [];
  const stories = media.filter(m => m.kind === 'story');
  const posts = media.filter(m => m.kind !== 'story');
  const lastStory = stories[0] ? stories[0].ts.slice(0, 10) : '';
  const lastPost = posts[0] ? posts[0].ts.slice(0, 10) : '';
  const storyUrl = S.liffUrl ? S.liffUrl + '?src=ig-story' : '';
  const hot = S.an && S.an.hours && S.an.hours.length ? S.an.hours.slice().sort((p, q) => q.n - p.n)[0].h : null;
  // 1. 空きがある日をストーリーで告知
  if (d.openings && d.openings.length) {
    const o = d.openings.slice(0, 3);
    out.push({ tone: 'act', title: '空いている日をストーリーで告知しましょう',
      body: o.map(x => jd(x.date) + ' ' + x.session + '（空き' + x.left + '席）').join('、') + 'に、まだ余裕があります。',
      action: '空き状況の写真や料理の写真に「予約はこちら」のリンクスタンプを付けて投稿' + (hot !== null ? '（予約ページがよく見られる' + hot + '時台の少し前がおすすめ）' : ''),
      copy: storyUrl });
  }
  // 2. ストーリーの間隔
  const sd = daysSince(lastStory);
  if (sd === null || sd >= 3) out.push({ tone: 'warn', title: lastStory ? '前回のストーリーから' + sd + '日たっています' : 'この期間、ストーリーがありません',
    body: 'ストーリーは24時間で消えるぶん、気軽に出せて、フォロワーの目に留まりやすい場所です。', action: '今日の仕込みや季節の食材など、1枚でいいので出す', copy: storyUrl });
  // 3. 投稿の間隔
  const pd = daysSince(lastPost);
  if (pd === null || pd >= 7) out.push({ tone: 'warn', title: lastPost ? '前回の投稿から' + pd + '日たっています' : 'この期間、投稿がありません',
    body: '投稿やリールは、お店を知らない人に見つけてもらう入口になります。1週間以上空くと、表示される機会が減りやすくなります。', action: '週1回を目安に、メニューや季節の一皿を投稿' });
  // 4. ストーリーを出した日の効果
  const dly = d.daily.filter(x => x.date < today());
  const sDays = dly.filter(x => x.stories > 0), nDays = dly.filter(x => x.stories === 0);
  if (sDays.length >= 3 && nDays.length >= 3) {
    const a1 = avg(sDays, 'opens'), a0 = avg(nDays, 'opens');
    if (a0 > 0 && a1 / a0 >= 1.2) out.push({ tone: 'good', title: 'ストーリーを出した日は、予約ページの閲覧が' + (a1 / a0).toFixed(1) + '倍です',
      body: 'ストーリーのある日は平均' + a1.toFixed(1) + '回、ない日は' + a0.toFixed(1) + '回開かれています。予約につながる効果が出ています。', action: '空きのある週は、ストーリーの回数を増やす' });
    else if (a0 > 0) out.push({ tone: 'info', title: 'ストーリーを出した日と出さない日で、閲覧に大きな差はありません',
      body: 'ストーリーのある日は平均' + a1.toFixed(1) + '回、ない日は' + a0.toFixed(1) + '回です。', action: 'ストーリーにリンクスタンプ（ストーリー用URL）を付けて、予約ページへの導線を作る', copy: storyUrl });
  }
  // 5. リールと投稿のどちらが伸びるか
  const reels = posts.filter(m => m.kind === 'reel' && m.reach), feeds = posts.filter(m => m.kind === 'feed' && m.reach);
  if (reels.length >= 2 && feeds.length >= 2) {
    const r = avg(reels, 'reach'), f = avg(feeds, 'reach');
    if (r > f * 1.3) out.push({ tone: 'good', title: 'リールは投稿の' + (r / f).toFixed(1) + '倍の人に届いています', body: 'リールの平均リーチは' + Math.round(r) + '人、投稿は' + Math.round(f) + '人です。', action: '調理の様子や盛り付けなど、短い動画を増やす' });
    else if (f > r * 1.3) out.push({ tone: 'info', title: '写真の投稿のほうが届いています', body: '投稿の平均リーチは' + Math.round(f) + '人、リールは' + Math.round(r) + '人です。', action: '写真の投稿を中心にし、リールは反応の良かった内容に絞る' });
  }
  // 6. 伸びやすい投稿時間
  const byHour = {};
  posts.filter(m => m.reach).forEach(m => { const h = Number(m.ts.slice(11, 13)); (byHour[h] = byHour[h] || []).push(m.reach); });
  const hours = Object.keys(byHour).filter(h => byHour[h].length >= 2).map(h => ({ h: Number(h), r: byHour[h].reduce((a, x) => a + x, 0) / byHour[h].length }));
  if (hours.length >= 2) {
    const best = hours.sort((p, q) => q.r - p.r)[0];
    out.push({ tone: 'info', title: best.h + '時台の投稿がいちばん届いています', body: 'この時間の投稿は平均' + Math.round(best.r) + '人に届いています。', action: '次の投稿は' + best.h + '時台に出す' });
  }
  // 7. プロフィールからリンクへ
  const pv = sum(d.daily, 'profileViews'), lt = sum(d.daily, 'linkTaps');
  if (pv >= 20) {
    const r = lt / pv;
    if (r < 0.05) out.push({ tone: 'warn', title: 'プロフィールを見た人のうち、リンクを押した人が' + Math.round(r * 100) + '%です',
      body: 'プロフィールは' + pv + '回見られていますが、リンクのタップは' + lt + '回です。', action: 'プロフィール文に「ご予約はリンクから」と入れ、リンクをInstagram用の予約URLにする', copy: S.liffUrl ? S.liffUrl + '?src=instagram' : '' });
    else out.push({ tone: 'good', title: 'プロフィールからリンクがよく押されています（' + Math.round(r * 100) + '%）', body: 'プロフィール' + pv + '回に対して、リンクのタップは' + lt + '回です。', action: '今のプロフィールのままで大丈夫です' });
  }
  // 8. 予約ページにつながった投稿
  const best = media.filter(m => m.visits > 0).sort((p, q) => q.visits - p.visits)[0];
  if (best) out.push({ tone: 'good', title: '予約ページにいちばんつながったのは、' + jd(best.ts.slice(0, 10)) + 'の' + IG_KIND[best.kind] + 'です',
    body: '出したあと24時間で、予約ページが' + best.visits + '回開かれました。' + (best.caption ? '「' + best.caption.slice(0, 30) + '…」' : ''), action: '同じ内容や同じ曜日・時間で、また出してみる' });
  // 9. フォロワーの増減
  const fl = d.daily.filter(x => x.followers);
  if (fl.length >= 2) {
    const ch = fl[fl.length - 1].followers - fl[0].followers;
    if (ch !== 0) out.push({ tone: ch > 0 ? 'good' : 'warn', title: 'フォロワーが' + (ch > 0 ? '+' : '') + ch + '人' + (ch > 0 ? '増えました' : '減りました'), body: '期間の初めは' + fl[0].followers + '人、今は' + fl[fl.length - 1].followers + '人です。', action: ch > 0 ? '増えた時期の投稿を振り返り、同じ方向性を続ける' : '投稿の頻度や内容が、フォロワーの関心と合っているかを見直す' });
  }
  return out;
}

    <div class="frow"><span class="fl">1日だけ</span><div class="ft" data-g="x"><div class="fb" style="width:${Math.round(a.repeat.once / Math.max(1, a.totals.users) * 100)}%"></div></div><span class="fn">${a.repeat.once}人</span></div>
