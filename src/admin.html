// 数値から読み取れることを文章にする
function buildInsights(a) {
  const out = [];
  const pct = (x, y) => (y ? Math.round(x / y * 100) : 0);
  const f = a.funnel;
  const MIN = 10;
  if (a.totals.opens < MIN) {
    out.push({ tone: 'info', title: 'まだデータが少なめです',
      body: '予約ページが' + MIN + '回以上開かれると、傾向をもとにした気づきが増えます。今は数字の動きだけ見ておけば大丈夫です。', ref: '開かれた回数' });
  }
  // 1. 期間の前半と後半の比較
  if (a.daily.length >= 14) {
    const half = Math.floor(a.daily.length / 2);
    const prev = a.daily.slice(0, half).reduce((x, d) => x + d.opens, 0);
    const last = a.daily.slice(-half).reduce((x, d) => x + d.opens, 0);
    if (prev + last >= MIN && prev > 0) {
      const ch = Math.round((last - prev) / prev * 100);
      if (ch >= 30) out.push({ tone: 'good', title: '閲覧が増えています（+' + ch + '%）', body: '期間の後半は前半より' + ch + '%多く見られています。最近の投稿や告知が効いている可能性があります。何をしたかを振り返っておくと、次に活かせます。', ref: '日ごとの閲覧' });
      else if (ch <= -30) out.push({ tone: 'warn', title: '閲覧が減っています（' + ch + '%）', body: '期間の後半は前半より' + Math.abs(ch) + '%少なくなっています。SNSでの告知や、Googleマップの情報（営業時間・写真）を見直すきっかけにしてください。', ref: '日ごとの閲覧' });
    }
  }
  // 2. 予約までの割合
  if (f.open >= MIN) {
    const cv = pct(f.request, f.open);
    if (cv >= 30) out.push({ tone: 'good', title: '見た人の' + cv + '%がリクエストまで進んでいます', body: '予約ページの使いやすさや、空き状況は十分に機能しています。閲覧数そのものを増やす（告知・Googleマップの充実）のが効果的です。', ref: '予約までの流れ' });
    else if (cv < 10) out.push({ tone: 'warn', title: 'リクエストまで進む人が少なめです（' + cv + '%）', body: '見に来ているのに予約に至っていません。下の「離れている場所」と「満席・締切で選べなかった日」を合わせて見てください。', ref: '予約までの流れ' });
  }
  // 3. いちばん離れている場所
  if (f.open >= MIN) {
    const steps = [
      ['日付を選ぶ前', f.open, f.date, '空いている日が少ない、受付期間が短い、休みの日が多いなどが考えられます。受付の最終日を延ばす、営業日を見直すと改善しやすい場所です。'],
      ['時間を選ぶところ', f.date, f.time, '日付は選んだものの、希望の時間が満席や締切になっている可能性があります。混む時間帯の席数や、時間の枠（間隔）を見直す目安になります。'],
      ['メニューを選ぶところ', f.time, f.course, 'メニューで迷っている、または最少人数・締切の条件で選べない可能性があります。内容の説明や、価格の表示を見直すと効果が出やすい場所です。'],
      ['お客様情報の入力', f.course, f.request, '入力の手間や、LINEの友だち追加が必要なことが負担になっている可能性があります。初めての方が多い時期に起きやすい傾向です。']
    ].filter(x => x[1] >= 5);
    if (steps.length) {
      const worst = steps.map(x => ({ name: x[0], rate: x[2] / x[1], lost: x[1] - x[2], hint: x[3] })).sort((p, q) => p.rate - q.rate)[0];
      if (worst.rate < 0.6) out.push({ tone: 'warn', title: 'いちばん離れているのは「' + worst.name + '」です（' + worst.lost + '人）', body: worst.hint, ref: '予約までの流れ' });
    }
  }
  // 4. 満席・締切で選べなかった需要
  const blockedTotal = a.blockedWeekday.reduce((x, y) => x + y, 0);
  if (blockedTotal >= 3) {
    const wd = a.blockedWeekday.indexOf(Math.max(...a.blockedWeekday));
    const top = a.blocked[0];
    out.push({ tone: 'warn', title: '満席・締切で予約できなかった人がのべ' + blockedTotal + '人います',
      body: '特に' + WD[wd] + '曜日に集中しています' + (top ? '（いちばん多いのは' + jd(top.date) + '・' + top.users + '人）' : '') + '。この曜日は席の配分（電話・DM用の押さえを減らす）、時間帯の追加、締切の見直しで受けられる人が増える可能性があります。', ref: '満席・締切で選べなかった日' });
  }
  // 5. 来店したい曜日
  const wantTotal = a.wantWeekday.reduce((x, y) => x + y, 0);
  if (wantTotal >= MIN) {
    const order = a.wantWeekday.map((n, i) => [i, n]).sort((p, q) => q[1] - p[1]);
    out.push({ tone: 'info', title: '来店したい曜日は「' + WD[order[0][0]] + '曜日」が最多です', body: '日付を選んだ人の' + pct(order[0][1], wantTotal) + '%が' + WD[order[0][0]] + '曜日です' + (order[1][1] > 0 ? '（次は' + WD[order[1][0]] + '曜日）' : '') + '。仕込みや人手の配分、限定メニューを出す曜日の参考になります。', ref: 'よく見られている日' });
  }
  // 6. よく見られる時間帯（告知のタイミング）
  const hourTotal = a.hours.reduce((x, y) => x + y.n, 0);
  if (hourTotal >= MIN) {
    const h = a.hours.slice().sort((p, q) => q.n - p.n)[0];
    out.push({ tone: 'info', title: '予約ページがよく見られるのは' + h.h + '時台です', body: 'SNSの投稿やLINEでのお知らせは、この少し前（' + Math.max(0, h.h - 1) + '時台）に出すと目に留まりやすくなります。', ref: '日ごとの閲覧' });
  }
  // 7. 入口
  const srcTotal = a.sources.reduce((x, y) => x + y.users, 0);
  if (srcTotal >= 5) {
    const known = a.sources.filter(x => ['google', 'homepage', 'instagram', 'ig-story', 'richmenu'].indexOf(x.src) >= 0);
    if (!known.length) out.push({ tone: 'info', title: 'どこから来たかが、まだ分かれていません', body: '「URL・LINE」タブにある入口ごとのURLを、Googleマップ・ホームページ・Instagram・リッチメニューにそれぞれ貼ると、どの入口が効いているかが分かります。', ref: 'どこから来たか' });
    else {
      const top = a.sources[0];
      out.push({ tone: 'info', title: 'いちばん多い入口は「' + (SRC_NAME[top.src] || top.src) + '」です（' + pct(top.users, srcTotal) + '%）', body: 'この入口の情報（写真・営業時間・メニュー）を充実させると、効果が出やすくなります。少ない入口は、URLが貼られているか、目立つ位置にあるかを確認してください。', ref: 'どこから来たか' });
    }
  }
  // 8. 見られているのに予約が少ないメニュー
  const weak = a.courses.filter(c => c.users >= 5 && c.requests / c.users < 0.15).sort((p, q) => q.users - p.users)[0];
  if (weak) out.push({ tone: 'warn', title: '「' + weak.name + '」は見られているのにリクエストが少なめです', body: weak.users + '人が見て、リクエストは' + weak.requests + '件です。価格、内容の説明、最少人数や締切の条件が合っていない可能性があります。', ref: 'メニュー' });
  // 9. 迷っている人
  if (a.lookers.length) out.push({ tone: 'info', title: '何度も見ているのに予約していない人が' + a.lookers.length + '人います', body: '日程や内容で迷っている可能性があります。来店時やお問い合わせのときに、空き状況を案内するきっかけにしてください（自動でメッセージは送りません）。', ref: '同じ人が見た日数' });
  return out;
}

const INSIGHT_ICON = { good: '↗', warn: '!', info: 'i', act: '▶' };

/* ---------- Instagram ---------- */
const IG_KIND = { feed: '投稿', reel: 'リール', story: 'ストーリー' };
function sum(list, k) { return list.reduce((a, x) => a + (Number(x[k]) || 0), 0); }
function avg(list, k) { const v = list.filter(x => x[k] !== null && x[k] !== undefined); return v.length ? sum(v, k) / v.length : 0; }
function daysSince(date) { return date ? diffDaysJs(date, today()) : null; }

function buildIgInsights(d) {
  const out = [];
  const media = d.media || [];
  const stories = media.filter(m => m.kind === 'story');
  const posts = media.filter(m => m.kind !== 'story');
  const lastStory = stories[0] ? stories[0].ts.slice(0, 10) : '';
  const lastPost = posts[0] ? posts[0].ts.slice(0, 10) : '';
  const storyUrl = S.liffUrl ? S.liffUrl + '?src=ig-story' : '';
  const hot = S.an && S.an.hours && S.an.hours.length ? S.an.hours.slice().sort((p, q) => q.n - p.n)[0].h : null;
  // 1. 空きがある日をストーリーで告知
  if (d.openings && d.openings.length) {
    const o = d.openings.slice(0, 3);
    out.push({ tone: 'act', title: '空いている日をストーリーで告知しましょう',
      body: o.map(x => jd(x.date) + ' ' + x.session + '（空き' + x.left + '席）').join('、') + 'に、まだ余裕があります。',
      action: '空き状況の写真や料理の写真に「予約はこちら」のリンクスタンプを付けて投稿' + (hot !== null ? '（予約ページがよく見られる' + hot + '時台の少し前がおすすめ）' : ''),
      copy: storyUrl });
  }
  // 2. ストーリーの間隔
  const sd = daysSince(lastStory);
  if (sd === null || sd >= 3) out.push({ tone: 'warn', title: lastStory ? '前回のストーリーから' + sd + '日たっています' : 'この期間、ストーリーがありません',
    body: 'ストーリーは24時間で消えるぶん、気軽に出せて、フォロワーの目に留まりやすい場所です。', action: '今日の仕込みや季節の食材など、1枚でいいので出す', copy: storyUrl });
  // 3. 投稿の間隔
  const pd = daysSince(lastPost);
  if (pd === null || pd >= 7) out.push({ tone: 'warn', title: lastPost ? '前回の投稿から' + pd + '日たっています' : 'この期間、投稿がありません',
    body: '投稿やリールは、お店を知らない人に見つけてもらう入口になります。1週間以上空くと、表示される機会が減りやすくなります。', action: '週1回を目安に、メニューや季節の一皿を投稿' });
  // 4. ストーリーを出した日の効果
  // 閲覧の記録が始まる前の日（0回）まで平均に入れると、ない日の平均がほぼ0になり倍率が極端になるので、記録のある日から数える。
  // 倍率ではなく、1日あたりの回数そのものを見せる
  const first = d.daily.find(x => x.opens > 0);
  const dly = first ? d.daily.filter(x => x.date >= first.date && x.date < today()) : [];
  const sDays = dly.filter(x => x.stories > 0), nDays = dly.filter(x => x.stories === 0);
  if (sDays.length >= 3 && nDays.length >= 3 && sum(nDays, 'opens') >= 5) {
    const a1 = avg(sDays, 'opens'), a0 = avg(nDays, 'opens');
    const r1 = a1.toFixed(1), r0 = a0.toFixed(1);
    if (a1 - a0 >= 1 && a1 >= a0 * 1.2) out.push({ tone: 'good', title: 'ストーリーを出した日は、予約ページがよく開かれています',
      body: '1日あたり、ストーリーのある日は' + r1 + '回、ない日は' + r0 + '回です（ある日' + sDays.length + '日・ない日' + nDays.length + '日の平均）。予約につながる効果が出ています。', action: '空きのある週は、ストーリーの回数を増やす' });
    else out.push({ tone: 'info', title: 'ストーリーを出した日と出さない日で、閲覧に大きな差はありません',
      body: '1日あたり、ストーリーのある日は' + r1 + '回、ない日は' + r0 + '回です。', action: 'ストーリーにリンクスタンプ（ストーリー用URL）を付けて、予約ページへの導線を作る', copy: storyUrl });
  }
  // 5. リールと投稿のどちらが伸びるか
  const reels = posts.filter(m => m.kind === 'reel' && m.reach), feeds = posts.filter(m => m.kind === 'feed' && m.reach);
  if (reels.length >= 2 && feeds.length >= 2) {
    const r = avg(reels, 'reach'), f = avg(feeds, 'reach');
    if (f >= 10 && r > f * 1.3) out.push({ tone: 'good', title: 'リールは投稿の' + (r / f).toFixed(1) + '倍の人に届いています', body: 'リールの平均リーチは' + Math.round(r) + '人、投稿は' + Math.round(f) + '人です。', action: '調理の様子や盛り付けなど、短い動画を増やす' });
    else if (r >= 10 && f > r * 1.3) out.push({ tone: 'info', title: '写真の投稿のほうが届いています', body: '投稿の平均リーチは' + Math.round(f) + '人、リールは' + Math.round(r) + '人です。', action: '写真の投稿を中心にし、リールは反応の良かった内容に絞る' });
  }
  // 6. 伸びやすい投稿時間
  const byHour = {};
  posts.filter(m => m.reach).forEach(m => { const h = Number(m.ts.slice(11, 13)); (byHour[h] = byHour[h] || []).push(m.reach); });
  const hours = Object.keys(byHour).filter(h => byHour[h].length >= 2).map(h => ({ h: Number(h), r: byHour[h].reduce((a, x) => a + x, 0) / byHour[h].length }));
  if (hours.length >= 2) {
    const best = hours.sort((p, q) => q.r - p.r)[0];
    out.push({ tone: 'info', title: best.h + '時台の投稿がいちばん届いています', body: 'この時間の投稿は平均' + Math.round(best.r) + '人に届いています。', action: '次の投稿は' + best.h + '時台に出す' });
  }
  // 7. プロフィールからリンクへ
  const pv = sum(d.daily, 'profileViews'), lt = sum(d.daily, 'linkTaps');
  if (pv >= 20) {
    const r = lt / pv;
    if (r < 0.05) out.push({ tone: 'warn', title: 'プロフィールを見た人のうち、リンクを押した人が' + Math.round(r * 100) + '%です',
      body: 'プロフィールは' + pv + '回見られていますが、リンクのタップは' + lt + '回です。', action: 'プロフィール文に「ご予約はリンクから」と入れ、リンクをInstagram用の予約URLにする', copy: S.liffUrl ? S.liffUrl + '?src=instagram' : '' });
    else out.push({ tone: 'good', title: 'プロフィールからリンクがよく押されています（' + Math.round(r * 100) + '%）', body: 'プロフィール' + pv + '回に対して、リンクのタップは' + lt + '回です。', action: '今のプロフィールのままで大丈夫です' });
  }
  // 8. 予約ページにつながった投稿
  const best = media.filter(m => m.visits > 0).sort((p, q) => q.visits - p.visits)[0];
  if (best) out.push({ tone: 'good', title: '予約ページにいちばんつながったのは、' + jd(best.ts.slice(0, 10)) + 'の' + IG_KIND[best.kind] + 'です',
    body: '出したあと24時間で、予約ページが' + best.visits + '回開かれました。' + (best.caption ? '「' + best.caption.slice(0, 30) + '…」' : ''), action: '同じ内容や同じ曜日・時間で、また出してみる' });
  // 9. フォロワーの増減
  const fl = d.daily.filter(x => x.followers);
  if (fl.length >= 2) {
    const ch = fl[fl.length - 1].followers - fl[0].followers;
    if (ch !== 0) out.push({ tone: ch > 0 ? 'good' : 'warn', title: 'フォロワーが' + (ch > 0 ? '+' : '') + ch + '人' + (ch > 0 ? '増えました' : '減りました'), body: '期間の初めは' + fl[0].followers + '人、今は' + fl[fl.length - 1].followers + '人です。', action: ch > 0 ? '増えた時期の投稿を振り返り、同じ方向性を続ける' : '投稿の頻度や内容が、フォロワーの関心と合っているかを見直す' });
  }
  return out;
}

/* =========================================================
 * Claude・Square・マネーフォワード（src/services.js とやりとりする）
 * ========================================================= */
// 日本語の折り返し：文節ごとにまとめて、変なところで改行しない
// Claude の文は「｜」で区切ってもらう。決まった文面などは、ひらがなと漢字の切れ目・句読点で区切る
function segJa(s) {
  const out = [];
  let cur = '';
  const ch = Array.from(s);
  for (let i = 0; i < ch.length; i++) {
    const c = ch[i], p = ch[i - 1], n = ch[i + 1];
    let cut = false;
    if (i > 0 && cur) {
      if (/[、。，．！？!?）」』】〉》・：／]/.test(p) && !/[、。，．！？!?）」』】〉》・：／]/.test(c)) cut = true;
      else if (/[ぁ-ゟ]/.test(p) && /[㐀-鿿々ァ-ヺA-Za-z0-9０-９¥￥（「『【〈《#＃]/.test(c) && !/^[おご]$/.test(cur)) cut = true;
      else if (/[ぁ-ゟ]/.test(p) && /[おご]/.test(c) && n && /[㐀-鿿]/.test(n)) cut = true;
    }
    if (cut) { out.push(cur); cur = ''; }
    cur += c;
  }
  if (cur) out.push(cur);
  return out;
}
function phrLine(line, cls) {
  const parts = line.indexOf('｜') >= 0 ? line.split('｜') : segJa(line);
  // 空白はまとまりの外に出して、単語のあいだのすき間を残す
  return parts.map(p => p.split(/(\s+)/).map(x => !x ? '' : /^\s+$/.test(x) ? ' '
    : `<span class="ph${cls && cls(x) ? ' ' + cls(x) : ''}">${esc(x)}</span>`).join('')).join('');
}
function phr(text, cls) {
  return String(text === undefined || text === null ? '' : text).split('\n').map(l => phrLine(l, cls)).join('<br>');
}
function plainJa(s) { return String(s || '').split('｜').join(''); }
function hashStr(s) { let h = 5381; s = String(s); for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function num(v) { return Number(String(v === undefined || v === null ? '' : v).replace(/[^\d]/g, '')) || 0; }
function fmtNum(v) { const n = num(v); return n ? n.toLocaleString() : ''; }
function jdShort(date) { const p = date.split('-').map(Number); return p[1] + '/' + p[2]; }
const WAIT = '<span class="waitbar"></span><span class="waitbar short"></span>';
// Claudeが書いたものに付けるマーク（考えているあいだは回る）
function spark(busy) { return `<svg class="spark${busy ? ' busy' : ''}" aria-hidden="true"><use href="#i-claude"/></svg>`; }
function aiTag(label, busy) { return `<span class="aitag">${spark(busy)}${label}</span>`; }
// 長く待つときは、Claudeのキャラクターが歩く
const CLAWD = '<svg class="clawd" viewBox="0 0 25 17" aria-hidden="true"><rect x="4" y="0" width="17" height="13"/><rect x="0" y="4" width="25" height="5"/><rect class="ce" x="6" y="2" width="2" height="2"/><rect class="ce" x="17" y="2" width="2" height="2"/><rect class="l1" x="4" y="13" width="2" height="4"/><rect class="l2" x="8" y="13" width="2" height="4"/><rect class="l1" x="15" y="13" width="2" height="4"/><rect class="l2" x="19" y="13" width="2" height="4"/></svg>';
function aiThink(text, long) {
  if (long) return `<span class="aithink long"><span class="aiwalk"><span class="trk"><span class="mv">${CLAWD}</span></span></span><span>${phr(text)}</span></span>`;
  return `<span class="aithink">${spark(true)}<span>${phr(text)}</span></span>`;
}
// 文面の欄の高さを中身に合わせる
function fitAreas() {
  document.querySelectorAll('#view textarea[data-auto]').forEach(t => { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; });
}
// 写真を小さくしてJPEGにする（送る量を減らす。長い辺 max px）
async function toJpeg(file, max, quality) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ng(new Error('写真を読み込めませんでした。別の写真でお試しください。')); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * k));
    c.height = Math.max(1, Math.round(img.naturalHeight * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', quality || 0.78);
  } finally {
    URL.revokeObjectURL(url);
  }
}
function renderSet() { if (S.tab === 'set') renderWhenIdle('set'); }
// ファイルを保存する（スマホは共有メニュー＝LINEやファイルに保存、パソコンはダウンロード）
async function saveFile(name, text) {
  const blob = new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' });
  const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (coarse && navigator.canShare && typeof File === 'function') {
    const file = new File([blob], name, { type: 'text/csv' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return true; }
      catch (e) { if (e && e.name === 'AbortError') return false; }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return true;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (x) { /* 何もしない */ }
    t.remove();
  }
  toast('コピーしました');
}

function addKey(d) { return d.mode + (d.mode === 'offer' ? ':' + d.offer : ''); }
// いま使うひと言（undefined＝まだ、null＝作れなかった、''＝足すことなし）
function curAdd(d) { return S.features.ai && d.ai ? d.adds[addKey(d)] : ''; }
function draftText(kind, x, d) {
  const a = curAdd(d);
  return kind === 'g' ? chgTemplate(x, d.mode, a ? plainJa(a) : '') : template(x, d, a ? plainJa(a) : '');
}
function newDraft(mode) { return { mode: mode, offer: 0, text: '', edited: false, editing: false, ai: true, adds: {}, wait: {}, err: '' }; }
// ひと言を Claude に頼む（同じ種類の返事は一度だけ。fresh のときは書き直し）
function wantAdd(kind, x, d, fresh) {
  if (!S.features.ai || !d.ai) return;
  const k = addKey(d);
  if (d.wait[k] || (!fresh && d.adds[k] !== undefined)) return;
  const offer = kind === 'r' && d.mode === 'offer' ? x.suggestions[d.offer] : null;
  if (kind === 'r' && d.mode === 'offer' && !offer) return;
  d.wait[k] = true;
  d.err = '';
  api('aiReply', { kind: kind, id: x.id, mode: d.mode, offer: offer, fresh: !!fresh, before: fresh ? plainJa(d.adds[k] || '') : '' })
    .then(res => { d.adds[k] = res.add || ''; })
    .catch(e => { if (d.adds[k] === undefined) d.adds[k] = null; d.err = e.message; })
    .finally(() => {
      delete d.wait[k];
      if (!d.edited && !d.editing && addKey(d) === k) d.text = draftText(kind, x, d);
      if (S.tab === 'today') renderWhenIdle('today');
    });
}
function draftTools(kind, x, d) {
  const add = curAdd(d);
  const wait = S.features.ai && d.ai && d.wait[addKey(d)];
  return `<div class="dlabel"><span>送る文面</span>${S.features.ai && d.ai && (add || wait) ? aiTag('Claudeの一言入り', wait) : ''}</div>`;
}
// 文面の下のボタン（Claudeの一言の書き直し・いつもの文面・直した文面を戻す）
function draftActs(kind, d) {
  const reset = d.edited ? `<button class="btn small" data-act="${kind === 'g' ? 'cresetText' : 'resetText'}">文面を元に戻す</button>` : '';
  const ai = !S.features.ai ? '' : d.ai
    ? '<button class="btn small" data-act="aiAgain">一言を書き直す</button><button class="btn small" data-act="aiOff">いつもの文面にする</button>'
    : `<button class="btn small" data-act="aiOn">${spark()}Claudeの一言を足す</button>`;
  return reset || ai ? `<div class="draftacts">${reset}${ai}</div>` : '';
}
function draftBox(kind, x, d) {
  const id = kind + x.id;
  if (d.editing || d.edited) {
    return `<textarea class="draft" rows="9" data-act="${kind === 'g' ? 'ctext' : 'text'}" data-auto="1" id="ta-${esc(id)}">${esc(d.text)}</textarea>`;
  }
  const p = kind === 'g' ? chgParts(x, d.mode) : parts(x, d);
  const add = curAdd(d);
  const wait = S.features.ai && d.ai && d.wait[addKey(d)];
  const mid = wait ? '<br><br><span class="addwait">' + aiThink('Claudeがご要望と来店の記録を読んで、一言を考えています') + WAIT + '</span>'
    : add ? `<br><br><mark class="add" data-appear="add:${esc(id)}:${hashStr(add)}">${spark()}${phr(add)}</mark>` : '';
  return `<div class="draft" data-act="editDraft" role="button" tabindex="0" aria-label="送る文面（押すと直せます）">${phr(p.head)}${mid}${phr(p.tail)}</div>`;
}
function draftHint(kind, d) {
  const add = curAdd(d);
  const out = [];
  if (!d.editing && !d.edited) out.push('文面を押すと、自由に直せます。');
  if (add && !d.edited) out.push('Claudeのマークが付いた色の部分は、ご要望や来店の記録を読んでClaudeが足した一言です（マークは送られません）。');
  if (d.err && S.features.ai && d.ai) out.push(d.err);
  if (kind === 'r') out.push(d.mode === 'offer' ? 'お客様には「確認して返事をする」ボタンが一緒に届きます。' : d.mode === 'ng' ? '' : 'お客様には「予約を確認する」ボタンが一緒に届きます。');
  else out.push(d.mode === 'ok' ? '承認すると、元の予約がこの日時に移ります。' : 'お断りすると、元の予約はそのまま残ります。');
  return out.filter(Boolean).map(t => `<span class="hl">${phr(t)}</span>`).join('');
}
// 文面の欄・ボタンの操作（予約のリクエスト r、変更のリクエスト g）
function draftAction(a, kind, x, d, b) {
  const redo = () => { d.text = draftText(kind, x, d); wantAdd(kind, x, d); refresh(); };
  if (a === 'mode' || a === 'cmode') { d.mode = b.dataset.mode; d.edited = false; d.editing = false; redo(); return true; }
  if (a === 'resetText' || a === 'cresetText') { d.edited = false; d.editing = false; redo(); return true; }
  if (a === 'aiOff') { d.ai = false; d.edited = false; d.editing = false; redo(); return true; }
  if (a === 'aiOn') { d.ai = true; d.edited = false; d.editing = false; redo(); return true; }
  if (a === 'aiAgain') {
    if (d.edited && !confirm('直した文面は元に戻ります。Claudeの一言を書き直しますか？')) return true;
    d.edited = false; d.editing = false;
    wantAdd(kind, x, d, true);
    d.text = draftText(kind, x, d);
    refresh();
    return true;
  }
  if (a === 'editDraft') {
    d.editing = true;
    refresh();
    const ta = $('ta-' + kind + x.id);
    if (ta) { ta.focus(); try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) { /* 何もしない */ } }
    return true;
  }
  return false;
}

/* ---------- 今日の画面：来店前メモ・売上・レシートを裏で読み込む ---------- */
function todayExtras() {
  const d = S.dayCache[today()];
  if (S.features.ai && d && (d.aiMissing || []).length && !S.memoWait[d.date]) loadMemos(d.date);
  if (S.features.square && Date.now() - (S.salesAt || 0) > 60000) loadSales();
  if (S.features.ai && S.features.mf && !S.rcptInfo) loadRcpt();
}
async function loadMemos(date) {
  S.memoWait[date] = true;
  try {
    const res = await api('aiMemos', { date: date });
    const d = S.dayCache[date];
    if (d) { d.aiMemos = Object.assign({}, d.aiMemos, res.memos); d.aiMissing = []; }
  } catch (e) {
    const d = S.dayCache[date];
    if (d) d.aiMissing = [];
  }
  delete S.memoWait[date];
  if (S.tab === 'today') renderWhenIdle('today');
}
async function loadSales(force) {
  S.salesAt = Date.now();
  try {
    const s = await api('sales', { force: !!force });
    S.sales = s;
  } catch (e) {
    S.sales = S.sales || { connected: true, error: e.message, open: [], total: 0, withRes: 0, walkIn: 0, count: 0, walkCount: 0, day: today() };
  }
  if (S.tab === 'today') renderWhenIdle('today');
}
async function loadRcpt() {
  try { S.rcptInfo = await api('rcptList'); } catch (e) { return; }
  if (S.tab === 'today') renderWhenIdle('today');
}

function memoHtml(d, r) {

/* ---------- 売上（Square） ----------
 * 会計は、予約の時間と会計の時刻から自動で「予約の会計」にする（割り勘は、同じ予約の会計の前後5分を同じ組にまとめる）
 * 予約のない会計は、その日の予約→ほかのお客様の順に選べる。選んだあとも「この日の会計をすべて見る・直す」から何度でも直せる
 * ここで選んだ内容は予約システムの中だけのもので、Squareのデータは変えない
 */
function salesHtml() {
  const s = S.sales;
  if (!s) return `<div class="card" data-key="sales"><h2>${icon('i-coin')}今日の売上 <span class="tag amber">Square</span></h2>${WAIT}</div>`;
  if (!s.connected) return '';
  const label = s.day === today() ? '今日の売上' : s.day === addDays(today(), -1) ? '昨日の売上' : jd(s.day) + 'の売上';
  const pr = s.total ? Math.round(s.withRes / s.total * 100) : 0;
  const pays = s.pays || [];
  let h = `<div class="card" data-key="sales"><h2>${icon('i-coin')}${label} <span class="tag amber">Square</span><span class="cnt" style="margin-left:auto">${s.syncedAt ? esc(s.syncedAt.slice(11)) + ' に取り込み' : ''}</span></h2>`;
  if (s.error) h += `<div class="warn" style="margin-bottom:8px">${phr(s.error)}</div>`;
  h += `<div class="sum3"><div><b>${yen(s.total)}</b><span>合計 ${s.count}件</span></div><div><b>${yen(s.withRes)}</b><span>予約あり ${s.resGroups || 0}組</span></div><div><b>${yen(s.walkIn)}</b><span>予約なし ${s.walkCount}件</span></div></div>`;
  if (s.total) h += `<div class="split" data-grow="split:${s.day}:${s.total}:${s.withRes}"><div data-g="x"><i class="a" style="width:${pr}%"></i><i class="b" style="width:${100 - pr}%"></i></div></div>`;
  h += goalBarHtml(s.goal, true);
  if (!S.salesList) {
    const open = pays.filter(p => p.link === '');
    if (open.length) {
      const shown = S.salesAll ? open : open.slice(0, 3);
      h += `<h3>予約のない会計 <span class="cnt">${open.length}件</span></h3>
        <div class="sub">${phr('だれの会計かを選ぶと、予約の会計にしたり、そのお客様の来店回数に1回足したりできます。分からない会計は「このまま」で大丈夫です（売上にはそのまま入ります）。')}</div>`;
      h += shown.map(p => payRow(p, false)).join('');
      if (open.length > shown.length) h += `<button class="more2" data-act="payAll">ほか ${open.length - shown.length}件を見る</button>`;
    }
  } else {
    h += `<h3>この日の会計 <span class="cnt">${pays.length}件</span></h3>` + pays.map(p => payRow(p, true)).join('');
  }
  if (pays.length) h += `<button class="more2" data-act="payList">${S.salesList ? '閉じる' : 'この日の会計をすべて見る・直す（' + pays.length + '件）'}</button>`;
  h += `<div class="sub" style="margin-top:8px">${phr('会計の時刻と予約の時間から、予約のお客様の会計かを自動で見分けています。割り勘のように1組で何回かに分けた会計は、1組としてまとめます。ここで選んだ内容は予約システムの中だけのもので、Squareのデータは変わりません。')}</div></div>`;
  return h;
}
function payStatus(p) {
  if (p.link === 'auto') return `<span class="tag green">予約：${p.resName ? esc(p.resName) + ' 様' : '予約の会計'}（自動）</span>`;
  if (p.link === 'res') return `<span class="tag green">予約：${p.resName ? esc(p.resName) + ' 様' : '予約の会計'}</span>`;
  if (p.link === 'cust') return `<span class="tag blue">予約なし：${esc(p.custName || 'お客様')} 様</span>`;

}
function payRow(p, inList) {

function payPicker(p) {
  const s = S.sales;

    ${resv.length ? resv.map(r => `<button class="cust resc${p.resId === r.id ? ' sel' : ''}" data-act="payToRes" data-id="${esc(p.id)}" data-res="${esc(r.id)}"><span class="rtm">${esc(r.time)}</span><div style="min-width:0"><div class="n">${esc(r.name)} 様 <span class="g">${r.guests}名</span></div><div class="m">${esc(r.time)}〜${esc(r.until)}${r.course ? '・' + esc(r.course) : ''}${r.paid ? '・会計 ' + yen(r.paid) : ''}</div></div></button>`).join('') : '<div class="sub">この日の予約はありません。</div>'}

    ${hits.map(c => `<button class="cust" data-act="payCust" data-id="${esc(p.id)}" data-ck="${esc(c.key)}"><div class="av ${c.total >= 3 ? 'vip' : ''}">${esc((c.name || '?').slice(0, 1))}</div><div style="min-width:0"><div class="n">${esc(c.name)}</div><div class="m">${c.total ? c.total + '回来店' : 'まだ来店なし'}${c.last ? '・最後 ' + jd(c.last) : ''}</div></div></button>`).join('')}
    ${q && S.salesHits && !hits.length ? '<div class="sub">見つかりませんでした。</div>' : ''}
    <div class="acts">${q ? `<button class="btn small" data-act="payNew" data-id="${esc(p.id)}">＋「${esc(q)}」様を新しく追加</button>` : ''}
      ${p.link !== 'skip' ? `<button class="btn small" data-act="paySkip" data-id="${esc(p.id)}">予約なし（名前なし）</button>` : ''}
      ${p.link === 'res' || p.link === 'cust' || p.link === 'skip' ? `<button class="btn small" data-act="payUndo" data-id="${esc(p.id)}">自動に戻す</button>` : ''}
      <button class="btn small ghost" data-act="payCancel">やめる</button></div>
  </div>`;
}
// 会計を結びつける：一覧から消えるものは縮めて消し、裏で保存する
async function linkPay(id, action, extra, label) {
  const el = S.salesList ? null : document.querySelector(`[data-key="pay:${CSS.escape(id)}"]`);
  const prev = S.sales;
  const anim = M.collapse(el);
  try {
    const res = await api('salesLink', Object.assign({ id: id, action: action }, extra || {}));
    await anim;
    S.sales = res.sales;
    S.salesPick = null; S.salesQ = ''; S.salesHits = null;
    refresh();
    toast(label || (action === 'skip' ? '予約なしにしました' : action === 'undo' ? '自動に戻しました' : '来店を1回足しました'));
  } catch (e) {
    await anim;
    S.sales = prev;
    refresh();
    fail(e);
  }
}
let payTimer = 0;
function payQuery() {
  clearTimeout(payTimer);
  payTimer = setTimeout(async () => {
    const q = (S.salesQ || '').trim();
    if (!q) { S.salesHits = null; refresh(); return; }
    try {
      const res = await api('customers', { q: q });
      if (q !== (S.salesQ || '').trim()) return;
      S.salesHits = res.customers.slice(0, 6);
      refresh();
    } catch (e) { /* 何もしない */ }
  }, 250);
}

/* ---------- 経費の登録（今日の画面から） ----------
 * レシート：撮った写真は順番待ちに入れて、裏で2枚ずつ読み取る。読み取りを待たずに、続けて何枚でも撮れる
 * 口座から出たお金：マネーフォワードに届いた口座の明細のうち、まだ登録していないものを、Claudeのおすすめの科目で登録する
 * デビットカードで払ったレシートは、口座の明細と結びつけて登録する（二重にならない。明細が届くまで預かる）
 */
const RATE_LABEL = { '8': '8%（食べ物・飲み物）', '10': '10%（それ以外）', mixed: '8%と10%がまざっている', none: '税なし（切手・印紙など）' };
const UNSURE_OF = { date: 'date', amount: 'total', payee: 'payee', accountId: 'account', rate: 'rate' };
function newRcpt() { return { open: false, queue: [], openId: null, accounts: [], pays: [], err: '', seq: 0, tx: null, txSel: {}, txWait: false }; }
function rcptButton() {
  const L = S.rcptInfo && S.rcptInfo.list;

  if (L) {

function accOptions(list, sel, short) {

// Claudeに相談（レシート・口座の明細ごとに、やりとりを覚えておく）
function askHtml(key, ctxLabel, iconOnly) {
  const k = S.ask[key];
  if (!k || !k.open) return iconOnly ? `<button class="askicon" data-act="askOpen" data-k="${esc(key)}" aria-label="Claudeに聞く" title="Claudeに聞く">${spark()}</button>` : `<button class="btn small ghost askbtn" data-act="askOpen" data-k="${esc(key)}">${spark()}Claudeに聞く</button>`;

    ${k.thread.map((t, i) => `<div class="ask-q">${esc(t.q)}</div><div class="ask-a" data-appear="aa:${esc(key)}:${i}"><span class="who">${spark()}Claude</span>${phr(t.a)}${t.accountId ? `<div><button class="btn small" data-act="askUse" data-k="${esc(key)}" data-acc="${esc(t.accountId)}">「${esc(t.account)}」にする</button></div>` : ''}</div>`).join('')}

    <div class="row" style="margin-top:6px"><input type="text" id="askIn-${esc(key)}" data-ask="${esc(key)}" value="${esc(k.input || '')}" placeholder="例）洗剤はどの科目？"><button class="btn small primary" data-act="askSend" data-k="${esc(key)}" style="flex-shrink:0">聞く</button></div>
    ${k.thread.length ? '' : `<div class="acts">${['これは何の科目？', 'デビットと現金の違いは？', '税率はどれ？'].map(x => `<button class="chip" data-act="askPreset" data-k="${esc(key)}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`}
    <button class="btn small ghost" data-act="askClose" data-k="${esc(key)}">閉じる</button>
  </div>`;
}
function askContext(key) {
  if (key.indexOf('tx:') === 0) {
    const t = (S.rcpt.tx && S.rcpt.tx.list || []).find(x => 'tx:' + x.id === key);
    const sel = t ? S.rcpt.txSel[t.id] || {} : {};
    const acc = t ? (S.rcpt.tx.accounts || []).find(a => a.id === sel.accountId) : null;
    return t ? { kind: 'tx', content: t.content, amount: t.amount, date: t.date, account: acc ? acc.name : '', pay: '口座から（デビットカード・引き落とし・振込）' } : {};
  }
  const q = rcptItem(key);
  if (!q || !q.form) return {};
  const acc = S.rcpt.accounts.find(a => a.id === q.form.accountId);
  const pay = S.rcpt.pays.find(p => p.kind === q.form.pay);
  return { payee: q.form.payee, items: q.form.memo, amount: q.form.amount, date: q.form.date, account: acc ? acc.name : '', pay: pay ? pay.label : '' };
}
async function askSend(key, text) {
  const k = S.ask[key];
  const q = String(text || '').trim();
  if (!k || !q || k.wait) return;
  k.wait = true; k.input = '';
  if ($('askIn-' + key)) $('askIn-' + key).value = '';
  k.thread.push({ q: q, a: '', accountId: '', account: '' });
  const t = k.thread[k.thread.length - 1];

    }).catch(e => { q.state = 'error'; q.err = e.message; }).finally(() => {

async function chatSend(text) {

// 「10/1〜10/8」「9月」「7〜9月」のように期間を書く
function spanText(from, to) {
  const f = from.split('-').map(Number), t = to.split('-').map(Number);
  const monthEnd = new Date(Date.UTC(t[0], t[1], 0)).getUTCDate() === t[2];
  if (f[2] === 1 && monthEnd) return f[1] === t[1] ? f[1] + '月' : f[1] + '〜' + t[1] + '月';
  return f[1] + '/' + f[2] + '〜' + t[1] + '/' + t[2];
}
// 今月の見通し：このままのペースの売上と利益、利益が出はじめる売上、月の目標
function outlookHtml(m) {

  const lines = [];

  if (g.breakEven) lines.push(['利益が出る売上', '月 ' + yen(g.breakEven) + ' 以上', 'これより少ないと赤字']);
  if (g.bookedGuests && !(g.on && g.need)) lines.push(['予約済み', g.bookedGuests + '名（約' + yen(g.bookedSales) + '）', '今月これからの予約']);

  return `<div class="card" data-key="outlook"><h2>${icon('i-coin')}今月の見通し</h2>${goalBarHtml(g, false)}${lines.length ? `<div class="gcalc" style="margin-top:8px">${lines.map(gRow).join('')}</div>` : ''}
    ${g.on ? '' : `<button class="btn ghost small" data-act="setPart" data-v="other" style="padding-left:0;margin-top:4px">月の目標を決める ›</button>`}</div>`;
}
function moneyKpi(v, k, c) { return `<div class="kpi"><div class="v">${v}</div><div class="k">${k}</div>${c || '<div class="c">&nbsp;</div>'}</div>`; }
function moneyHtml() {

  </div><div class="kpis money">
    ${moneyKpi(food !== null ? food + '%' : '–', '食材費の割合', foodP !== null ? `<div class="c2">${esc(was)}：${foodP}%</div>` : '')}
    ${moneyKpi(m.hasSales && one !== null ? yen(one) : '–', '1人あたり（予約）', m.hasSales && oneP !== null ? `<div class="c2">${esc(was)}：${yen(oneP)}</div>` : '')}

      ${pts.length >= 2 || zero ? `<svg class="pline" viewBox="0 0 ${cnt * 10} ${PH}" preserveAspectRatio="none" aria-hidden="true">${zero ? `<line x1="0" x2="${cnt * 10}" y1="${PH - zero}" y2="${PH - zero}" class="zl"/>` : ''}${pts.length >= 2 ? `<polyline points="${pts.join(' ')}"/>` : ''}</svg>` : ''}</div>

  if (m.hasExpense) {

    if (rest) rows.push({ name: 'そのほか', value: rest });

    h += `<div class="card" data-grow="mex:${key}:${n.expense}"><h2>${icon('i-pot')}経費の内訳 <span class="tag blue">マネーフォワード</span></h2>
      ${rows.length ? rows.map(x => `<div class="erow"><span class="fl">${esc(x.name)}</span><div class="ft" data-g="x"><div class="fb" style="width:${Math.round(x.value / mxe * 100)}%"></div></div><span class="fn">${yen(x.value)}</span></div>`).join('') : '<div class="sub">この期間の経費はまだ登録されていません。</div>'}
      <div class="sub" style="margin-top:6px">${phr('家賃など月末にまとめて登録する経費は、登録した時点で反映されます。')}</div></div>`;
    if (m.payees && m.payees.length) {
      const mp = Math.max(1, ...m.payees.map(x => x.value));
      h += `<div class="card" data-grow="mpy:${key}:${n.expense}"><h2>${icon('i-coin')}主な支払先</h2>
        ${m.payees.slice(0, 6).map(x => `<div class="erow"><span class="fl">${esc(x.name)}</span><div class="ft" data-g="x"><div class="fb" style="width:${Math.round(x.value / mp * 100)}%"></div></div><span class="fn">${yen(x.value)}</span></div>`).join('')}
        <div class="sub" style="margin-top:6px">${phr('マネーフォワードの仕訳の摘要（お店の名前）ごとの合計です。')}</div></div>`;
    }
  }
  if (!S.features.square) h += `<div class="card"><h2>Squareはまだつながっていません</h2><div class="sub">${phr('Squareの開発者画面で発行したアクセストークンを、Cloudflareのシークレット「SQUARE_ACCESS_TOKEN」に登録すると、売上が出ます。')}</div></div>`;
  if (!S.features.mf) h += `<div class="card"><h2>マネーフォワードはまだつながっていません</h2><div class="sub">${phr('マネーフォワードで発行したAPIキーを、Cloudflareのシークレット「MF_API_KEY」に登録すると、経費が出ます。')}</div></div>`;
  return h;
}

/* ---------- Instagramの文案（設定＞分析＞Instagram） ---------- */
async function loadIg() {
  try {
    const r = await api('igOpenings');
    const g = S.igd || { drafts: {}, kind: 'story', photo: '', wait: {}, err: '', editing: '', style: [] };
    g.list = r.openings;
    g.style = r.style || g.style || [];
    Object.keys(r.drafts || {}).forEach(k => { if (!g.drafts[k]) g.drafts[k] = r.drafts[k]; });
    if (!g.sel || (g.sel !== 'free' && !g.list.some(o => o.date + ':' + o.session === g.sel))) g.sel = g.list[0] ? g.list[0].date + ':' + g.list[0].session : 'free';
    S.igd = g;
    renderSet();
  } catch (e) { /* 文案だけ出さない */ }
}
function igWhere(sel) {
  const i = sel.indexOf(':');
  return sel === 'free' ? { date: 'free', session: '' } : { date: sel.slice(0, i), session: sel.slice(i + 1) };
}
// 選んでいる種類（ストーリー・投稿・リール）の文だけを作る・書き直す
async function igMake(fresh) {
  const g = S.igd;
  if (!g) return;
  const sel = g.sel, kind = g.kind, wk = sel + '|' + kind;
  if (g.wait[wk]) return;
  const dr = g.drafts[sel] || {};
  if (fresh && dr.edited && dr.edited[kind] && !confirm('直した文は、書き直した文に置き換わります。よろしいですか？')) return;
  g.wait[wk] = true; g.err = ''; g.editing = '';
  renderSet();
  try {
    const r = await api('igDraft', Object.assign(igWhere(sel), { kind: kind, image: g.photo || undefined, before: fresh && dr[kind] ? plainJa(dr[kind]) : '' }));
    g.drafts[r.key] = Object.assign({}, g.drafts[r.key], r.draft);
    if (r.style && r.style.length) g.style = r.style;
  } catch (e) { g.err = e.message; }
  delete g.wait[wk];
  renderSet();
}
async function igPhoto(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file || !S.igd) return;
  try { S.igd.photo = await toJpeg(file, 1280); } catch (e) { alert(e.message); return; }
  igMake(true);
}
// 手で直した文は、少し待ってから保存する（打っているあいだは送らない）
let igSaveTimer = 0;
function igTyped(text) {
  const g = S.igd;
  const sel = g.sel, kind = g.kind;
  const dr = g.drafts[sel] = g.drafts[sel] || {};
  dr[kind] = text;
  dr.edited = Object.assign({}, dr.edited, { [kind]: true });
  clearTimeout(igSaveTimer);
  igSaveTimer = setTimeout(() => { api('igSave', Object.assign(igWhere(sel), { kind: kind, text: text })).catch(e => toast(e.message)); }, 700);
}
async function igDelete(b) {
  const g = S.igd;
  const sel = g.sel, kind = g.kind;
  if (!confirm('この' + { story: 'ストーリー', post: '投稿', reel: 'リール' }[kind] + 'の文案を消しますか？')) return;
  clearTimeout(igSaveTimer);
  await M.collapse(document.querySelector('[data-key="igbox"]'));
  const dr = g.drafts[sel];
  if (dr) { delete dr[kind]; if (dr.edited) delete dr.edited[kind]; }
  g.editing = '';
  renderSet();
  try { await api('igSave', Object.assign(igWhere(sel), { kind: kind, remove: true })); } catch (e) { fail(e); }
}
function igDraftHtml() {
  if (!S.features.ai) return '';
  const g = S.igd;
  const busy = !!g && !!g.wait[g.sel + '|' + g.kind];
  let h = `<div class="card" data-key="igd"><h2>${icon('i-pen')}投稿の文案 ${aiTag('Claudeの文案', busy)}</h2>`;
  if (!g) return h + WAIT + '</div>';
  const opts = g.list.map(o => ({ key: o.date + ':' + o.session, label: jdShort(o.date) + '（' + WD[weekday(o.date)] + '）' + o.label, tag: '空き' + o.left + '席' }))
    .concat([{ key: 'free', label: 'ふだんの投稿', tag: '' }]);
  h += `<div class="sub" style="margin-bottom:8px">${phr('告知したい日を選ぶと、これまでの投稿の書き方に合わせて文を用意します。')}</div>
    <div class="filters" data-mg="igsel" data-mgs=".chip.on">${opts.map(o => `<button class="chip ${g.sel === o.key ? 'on' : ''}" data-act="igSel" data-v="${esc(o.key)}">${esc(o.label)}${o.tag ? ` <span class="fc">${esc(o.tag)}</span>` : ''}</button>`).join('')}</div>
    <div class="seg" data-mg="igkind" data-mgs="button.on">${[['story', 'ストーリー'], ['post', '投稿'], ['reel', 'リール']].map(k => `<button class="${g.kind === k[0] ? 'on' : ''}" data-act="igKind" data-v="${k[0]}">${k[1]}</button>`).join('')}</div>`;
  h += g.photo
    ? `<div class="igph"><img src="${g.photo}" alt="選んだ料理の写真"><div style="flex:1;min-width:0">${phr('この写真に合わせた文にしています')}</div><button class="btn small ghost" data-act="igPhotoOff">外す</button></div>`
    : `<label class="addph" for="igPhoto">${icon('i-camera')}<span>${phr('料理の写真を選ぶと、写真に合わせた文にします（なくても大丈夫です）')}</span></label>`;
  h += '<input type="file" id="igPhoto" accept="image/*" class="vh" tabindex="-1">';
  const dr = g.drafts[g.sel] || {};
  const text = dr[g.kind];
  const wk = g.sel + '|' + g.kind;
  if (g.wait[wk]) h += `<div class="igtext" data-key="igw">${aiThink('Claudeがこれまでの投稿を読んで書いています', true)}${WAIT}</div>`;
  else if (text) {
    const editing = g.editing === wk;
    h += `<div data-key="igbox">${editing
      ? `<textarea class="igtext igta" id="igTa" data-auto="1" rows="6">${esc(plainJa(text))}</textarea>`
      : `<div class="igtext" data-act="igEdit" role="button" tabindex="0" aria-label="文案（押すと直せます）" data-appear="ig:${esc(g.sel)}:${g.kind}:${hashStr(text)}">${phr(text, x => (x[0] === '#' ? 'hash' : ''))}</div>`}
      <div class="sub" style="margin-top:4px">${phr(editing ? '直した文は、そのまま残ります。' : '文を押すと、自由に直せます。')}${dr.edited && dr.edited[g.kind] ? '<span class="tag gray" style="margin-left:6px">直した文</span>' : ''}</div>
      <div class="acts"><button class="btn primary small" data-act="igCopy">文をコピー</button>${g.kind === 'story' && S.liffUrl ? `<button class="btn small" data-act="copyUrl" data-v="${esc(S.liffUrl + '?src=ig-story')}">予約URLをコピー</button>` : ''}<button class="btn small" data-act="igAgain">書き直す</button><button class="btn small ghost" data-act="igDel">消す</button></div></div>`;
  } else h += `<button class="btn primary wide" data-act="igMake" style="margin-top:10px">${{ story: 'ストーリー', post: '投稿', reel: 'リール' }[g.kind]}の文案を作る</button>`;
  if (g.err) h += `<div class="warn">${phr(g.err)}</div>`;
  if (g.style && g.style.length) h += `<h3>${spark()}Claudeが読んだ、これまでの投稿の書き方</h3><div class="stylebox">${g.style.map(x => `<span class="hl">・${phr(x)}</span>`).join('')}</div>`;
  return h + '</div>';
}

$('view').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (S.tab === 'today') {
    const cc = b.closest('[data-cid]');
    if (cc) {
      const c = S.req.changes.find(x => x.id === cc.dataset.cid);
      if (!c) return;
      const d = S.drafts['g' + c.id];
      if (draftAction(a, 'g', c, d, b)) return;
      if (a === 'csend') await sendChangeReply(c, d, b, false);
      return;
    }
    const card = b.closest('[data-rid]');
    if (card) {
      const r = S.req.waiting.find(x => x.id === card.dataset.rid);
      if (!r) return;
      const d = S.drafts[r.id];
      if (draftAction(a, 'r', r, d, b)) return;
      if (a === 'send') await sendReply(r, d, b, false);
      return;
    }
  }
  if (b.tagName === 'INPUT' && b.type !== 'radio') return;
  const handler = ACTIONS[S.tab];
  if (handler) await handler(a, b);
});

$('view').addEventListener('input', e => {
  if (S.tab === 'set' && e.target.id === 'goalAmt' && S.goal) {
    S.goal.form.amount = e.target.value;
    const box = document.querySelector('[data-key=goalcalc]');
    if (box) box.outerHTML = goalCalcHtml();
    return;
  }
  if (S.tab === 'book' && S.edit && e.target.dataset.e) {
    const k = e.target.dataset.e;
    S.edit[k] = e.target.value;
    if (k === 'text') S.edit.edited = true;
    if ($('eErr')) $('eErr').textContent = '';
    if (k === 'guests' || k === 'name') softUpdateEdit();
    return;
  }
  if (S.tab === 'cust' && e.target.id === 'mergeQ') {
    S.mergeQ = e.target.value;
    const pos = e.target.selectionStart;
    refresh();
    const el = $('mergeQ'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) { /* 何もしない */ } }
    return;
  }
  if (S.tab === 'cust' && e.target.id === 'custQ') {
    S.custQ = e.target.value;
    clearTimeout(S.custTimer);
    S.custTimer = setTimeout(reload, 300);
    return;
  }
  if (S.tab === 'set' && e.target.id === 'igTa' && S.igd) { igTyped(e.target.value); fitAreas(); return; }
  if (S.tab === 'set' && e.target.id === 'aiNote') { S.noteText = e.target.value; if (!S.noteDirty) { S.noteDirty = true; refresh(); } fitAreas(); return; }
  if (S.tab === 'set' && e.target.id === 'chatIn') { S.chat.input = e.target.value; return; }
  if (S.tab === 'today' && e.target.dataset.ask && S.ask[e.target.dataset.ask]) { S.ask[e.target.dataset.ask].input = e.target.value; return; }
  if (S.tab !== 'today') return;
  if (e.target.id === 'payQ') { S.salesQ = e.target.value; payQuery(); return; }
  if (e.target.dataset.rf && rcptItem(e.target.dataset.qid)) {
    const q = rcptItem(e.target.dataset.qid), k = e.target.dataset.rf;
    q.form[k] = e.target.value;
    q.form.unsure = (q.form.unsure || []).filter(x => x !== UNSURE_OF[k]);
    const er = $('rErr-' + q.id); if (er) er.textContent = '';
    refresh();
    return;
  }
  const cc = e.target.closest('[data-cid]');
  if (cc && e.target.dataset.act === 'ctext') {
    const d = S.drafts['g' + cc.dataset.cid];
    if (!d.edited) { d.edited = true; refresh(); }
    d.text = e.target.value;
    fitAreas();
    const er = cc.querySelector('[data-cerr]'); if (er) er.textContent = '';
    return;
  }
  const card = e.target.closest('[data-rid]');
  if (!card || e.target.dataset.act !== 'text') return;
  const d = S.drafts[card.dataset.rid];
  if (!d.edited) { d.edited = true; d.text = e.target.value; refresh(); }
  d.text = e.target.value;
  fitAreas();
  const er = card.querySelector('[data-err]'); if (er) er.textContent = '';
});

  if (e.target.id === 'rcptCam' || e.target.id === 'rcptLib') { rcptFiles(e.target); return; }
  if (e.target.id === 'igPhoto') { igPhoto(e.target); return; }

      S.rcpt.txOff = S.rcpt.txOff || {};
      if (e.target.checked) delete S.rcpt.txOff[e.target.dataset.txpick]; else S.rcpt.txOff[e.target.dataset.txpick] = true;

      return;
    }
    if (e.target.dataset.tx && S.rcpt && S.rcpt.txSel) {

      sel[e.target.dataset.tf] = e.target.value;

      if (e.target.dataset.tf === 'accountId' && txPersonal(e.target.value) && sel.rate !== 'none') { sel.rate = 'none'; refresh(); }

    }
    if (e.target.dataset.rf && rcptItem(e.target.dataset.qid)) {

      q.form.unsure = (q.form.unsure || []).filter(x => x !== UNSURE_OF[e.target.dataset.rf]);
      refresh();
      return;
    }
    const card = e.target.closest('[data-rid]');
    if (card && e.target.dataset.act === 'offer') {
      const r = S.req.waiting.find(x => x.id === card.dataset.rid);
      const d = S.drafts[r.id];
      d.offer = Number(e.target.value); d.edited = false; d.editing = false; d.text = draftText('r', r, d);
      wantAdd('r', r, d);
      refresh();

  } else if (S.tab === 'book') {
    if (S.edit && e.target.dataset.e) {

      if (['date', 'time', 'courseId'].indexOf(e.target.dataset.e) >= 0) updateEditView();

    if (e.target.id === 'hAll') { readHold(); }
    if (e.target.id === 'hDate' && e.target.value) { readHold(); goDayKeep(e.target.value, S.hold); }
  }
});

/* ---------- 引っぱって更新：画面のいちばん上で下に引くと、最新にする ---------- */
(function () {
  const ind = document.createElement('div');
  ind.className = 'ptr';
  ind.setAttribute('aria-hidden', 'true');
  ind.innerHTML = '<svg class="ink"><use href="#i-refresh"/></svg>';
  document.body.appendChild(ind);
  const GO = 64, MAX = 96;
  let y0 = null, pull = 0, busy = false;
  const place = p => { ind.style.transform = 'translate(-50%,' + (p - 46) + 'px) rotate(' + Math.round(p * 3.2) + 'deg)'; ind.style.opacity = String(Math.min(1, p / GO)); };
  const hide = () => {
    const from = ind.style.transform;
    place(0);
    if (!M.reduce() && ind.animate) ind.animate([{ transform: from, opacity: 1 }, { transform: ind.style.transform, opacity: 0 }], { duration: 260, easing: 'cubic-bezier(.3,.7,.2,1)' });
  };
  window.addEventListener('touchstart', e => {
    y0 = null;
    if (busy || window.scrollY > 0 || e.touches.length !== 1 || $('appView').classList.contains('hidden')) return;
    if (e.target.closest('input, textarea, select, [data-tip], .filters, .m-tipping')) return;
    y0 = e.touches[0].clientY; pull = 0;
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy <= 0 || window.scrollY > 0) { if (pull) { pull = 0; place(0); } return; }
    // 引いた長さの半分だけ動かし、だんだん重くする
    pull = Math.min(MAX, dy * 0.5);
    place(pull);
  }, { passive: true });
  window.addEventListener('touchend', async () => {
    if (y0 === null) return;
    y0 = null;
    if (pull < GO) { if (pull) hide(); pull = 0; return; }
    busy = true; pull = 0;
    place(GO);
    ind.classList.add('spin');
    try {
      const p = reload();
      if (S.tab === 'today' && S.features.square) loadSales(true);
      if (S.tab === 'set' && S.setPart === 'stats') loadDash();
      await p;
      toast('最新にしました');
    } finally {
      ind.classList.remove('spin');
      hide();
      busy = false;
    }
  });
})();

}, 120000);
