    <div class="frow"><span class="fl">4日以上</span><div class="ft" data-g="x"><div class="fb" style="width:${Math.round(a.repeat.many / Math.max(1, a.totals.users) * 100)}%"></div></div><span class="fn">${a.repeat.many}人</span></div>
    <h3>何度も見ているのに、まだ予約していない人</h3>
    ${a.lookers.length ? a.lookers.map(x => `<div class="item row"><span style="flex:1">${x.name ? esc(x.name) + ' 様' : '<span class="sub">まだ予約がない方（お名前不明）</span>'}</span><span class="sub">${x.days}日・${x.opens}回</span><span class="sub" style="width:72px;text-align:right">最後 ${Number(x.last.slice(5, 7))}/${Number(x.last.slice(8))}</span></div>`).join('') : '<div class="sub">いません。</div>'}
    <div class="why">この数字から分かること：何日も見ている人は、日程やメニューで迷っている可能性があります。来店時やお問い合わせのときの声かけのきっかけになります。</div>
    <div class="sub" style="margin-top:6px">お店のLINEアカウントで開いた分は数えていません。記録は180日で自動的に消えます。</div>
  </div>`;
}

  return `<div class="card">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">メニュー</h2><button class="btn small" data-act="new">＋ 追加</button></div>
    <div class="sub" style="margin:4px 0 6px">メニューごとに、料金、予約できる時間帯・曜日、締切を決められます。スイッチをオフにすると予約ページに出なくなります。</div>
    ${ed && !ed.id ? courseForm(ed) : ''}
    ${list.length ? list.map((c, i) => `<div class="course ${c.visible ? '' : 'off'}" data-key="c:${esc(c.id)}">
      <div style="display:flex;flex-direction:column">
        <button class="icon" data-act="up" data-id="${esc(c.id)}" aria-label="上へ" ${i === 0 ? 'style="visibility:hidden"' : ''}>${icon('i-up')}</button>
        <button class="icon" data-act="down" data-id="${esc(c.id)}" aria-label="下へ" ${i === list.length - 1 ? 'style="visibility:hidden"' : ''}>${icon('i-down')}</button>
      </div>
      <div class="body"><b>${esc(c.name)}</b>
        <div class="sub">${priceText(c)}・${c.sessions.map(k => esc(SN(k))).join('/')}・${c.min_guests}名から${c.cap ? '・同じ時間に' + c.cap + '名まで' : ''}</div>
        <div class="sub">${c.weekdays.length === 7 ? '毎日' : c.weekdays.map(d => WD[d]).join('')}・予約は${ruleText(cutoffRule(c, S.settings))}・変更は${ruleText(changeRule(c, S.settings))}</div></div>
      <button class="btn small" data-act="edit" data-id="${esc(c.id)}" style="padding:6px 10px">${icon('i-pen')}編集</button>
      <button class="sw ${c.visible ? 'on' : ''}" data-act="toggle" data-id="${esc(c.id)}" data-msw="${esc(c.id)}" aria-label="予約ページへの表示" aria-pressed="${c.visible}"><span class="knob"></span></button>
    </div>${ed && ed.id === c.id ? courseForm(ed) : ''}`).join('') : '<div class="sub">メニューがありません。「追加」から登録してください。</div>'}
  </div>`;
}

const MENU_ACTS = ['new', 'edit', 'close', 'cSession', 'cDay', 'cMode', 'cChgMode', 'up', 'down', 'toggle', 'saveCourse', 'delete'];
ACTIONS.set = async (a, b) => {
  if (a === 'addSession') {
    const name = (prompt('追加する時間帯の名前を入力してください。\n例）ディナーセット、ティータイム') || '').trim();
    if (!name) return;
    const keys = KEYS();
    if (keys.some(k => SN(k) === name)) { alert('同じ名前の時間帯があります。'); return; }
    const key = 's' + Date.now().toString(36);
    const last = S.settings.sessions[keys[keys.length - 1]];
    const next = JSON.parse(JSON.stringify(S.settings));
    next.sessions[key] = {
      name: name, en: '', short: name.slice(0, 1),
      open: last ? last.open : '18:00', close: last ? last.close : '22:00',
      first: last ? last.first : '18:00', last: last ? last.last : '19:30',
      interval: last ? last.interval : 30, stay: last ? last.stay : 120
    };
    try {
      S.settings = (await save(() => api('saveSettings', next))).settings;
      toast('「' + name + '」を追加しました。時間を設定して保存してください');
      staleMonths();
      refresh();
    } catch (e) { alert(e.message); }
    return;
  }
  if (a === 'delSession') {
    const k = b.dataset.k;
    if (KEYS().length <= 1) { alert('時間帯は1つ以上必要です。'); return; }
    if (!confirm('「' + SN(k) + '」を削除しますか？\nこの時間帯のメニューや営業日の設定からも外れます。すでに入っている予約は残ります。')) return;
    const next = JSON.parse(JSON.stringify(S.settings));
    delete next.sessions[k];
    Object.keys(next.weekly).forEach(d => { next.weekly[d] = (next.weekly[d] || []).filter(x => x !== k); });
    try {
      S.settings = (await save(() => api('saveSettings', next))).settings;
      S.courses = (await api('courses')).courses;
      staleMonths();
      toast('削除しました');
      refresh();
    } catch (e) { alert(e.message); }
    return;
  }
  if (a === 'save') {
    const v = id => ($(id) ? $(id).value : null);
    const next = JSON.parse(JSON.stringify(S.settings));
    if ($('cutDays')) {
      next.cutoff = { days: Number(v('cutDays')), time: v('cutTime') };
      next.changeCutoff = { days: Number(v('chgDays')), time: v('chgTime') };
      ['aheadDays', 'cancelDays', 'seats', 'maxGuests', 'maxActive', 'remindHours'].forEach(k => { next[k] = Number(v(k)); });
      next.openUntil = $('openUntil') ? v('openUntil') : '';
      next.replyHint = v('replyHint');
    }
    KEYS().forEach(k => {
      if (!$(k + '_open')) return;
      next.sessions[k] = {
        name: v(k + '_name'), en: S.settings.sessions[k].en || '', short: v(k + '_short'),
        open: v(k + '_open'), close: v(k + '_close'), first: v(k + '_first'), last: v(k + '_last'),
        interval: Number(v(k + '_interval')), stay: Number(v(k + '_stay'))
      };
    });
    if ($('setErr')) $('setErr').textContent = '';
    const mo = M.busy(b);
    try {
      S.settings = (await save(() => api('saveSettings', next))).settings;
      await mo.ok();
      staleMonths();
      toast('設定を保存しました');
      refresh();
    } catch (e) { mo.fail(); if ($('setErr')) $('setErr').textContent = e.message; }
  } else if (a === 'copy') {
    const el = $('liffUrl');
    el.select();
    try { await navigator.clipboard.writeText(el.value); } catch (e) { document.execCommand('copy'); }
    toast('コピーしました');
  } else if (a === 'logout') {
    if (!confirm('この端末からログアウトしますか？')) return;
    try { await api('logout'); } catch (e) { /* 何もしない */ }
    location.reload();
  }
};

/* ---------- 操作の受け付け ---------- */

const setActions = ACTIONS.set;
ACTIONS.set = async (a, b) => {
  if (a === 'openMode') { S.openMode = b.value; if (b.value === 'rolling') { const n = JSON.parse(JSON.stringify(S.settings)); n.openUntil = ''; S.settings.openUntil = ''; } else if (!S.settings.openUntil) { S.settings.openUntil = monthEnd(today(), 1); } refresh(); return; }
  if (a === 'openPick') { $('openUntil').value = b.dataset.v; toast(Number(b.dataset.v.slice(5, 7)) + '月末までにしました。「設定を保存する」で反映されます'); return; }
  if (a === 'setPart') {
    S.setPart = b.dataset.v; S.editCourse = null; refresh();
    if (S.setPart === 'stats') { try { S.an = await api('analytics', { days: S.anDays }); refresh(); } catch (e) { fail(e); } }
    return;
  }
  if (a === 'anView') {
    S.anView = b.dataset.v; refresh();
    if (S.anView === 'ig' && !S.ig) { try { S.ig = await api('igStats', { days: S.anDays }); refresh(); } catch (e) { fail(e); } }
    if (S.anView === 'site' && !S.an) { try { S.an = await api('analytics', { days: S.anDays }); refresh(); } catch (e) { fail(e); } }
    return;
  }
  if (a === 'igDays') { S.anDays = Number(b.dataset.v); S.ig = null; S.an = null; refresh(); try { S.ig = await api('igStats', { days: S.anDays }); refresh(); } catch (e) { fail(e); } return; }
  if (a === 'igSync') {
    const mo = M.busy(b);
    try {
      const r = await api('igSync');
      await mo.ok();
      if (r.result && r.result.ok === false) toast(r.result.message); else toast('Instagramの数値を取り込みました');
      S.ig = await api('igStats', { days: S.anDays }); refresh();
    } catch (e) { mo.fail(); fail(e); }
    return;
  }
  if (a === 'anReload') {
    const mo = M.busy(b);
    try { S.an = await api('analytics', { days: S.anDays }); await mo.ok(); toast('最新にしました'); refresh(); } catch (e) { mo.fail(); fail(e); }
    return;
  }
  if (a === 'anDays') { S.anDays = Number(b.dataset.v); S.an = null; refresh(); try { S.an = await api('analytics', { days: S.anDays }); refresh(); } catch (e) { fail(e); } return; }
  if (a === 'copyUrl') { try { await navigator.clipboard.writeText(b.dataset.v); } catch (e) { /* 何もしない */ } toast('コピーしました'); return; }
  if (a === 'weekly') {
    const i = b.dataset.w, k = b.dataset.k;
    const next = JSON.parse(JSON.stringify(S.settings));
    const cur = next.weekly[i] || [];
    next.weekly[i] = cur.indexOf(k) >= 0 ? cur.filter(x => x !== k) : cur.concat(k);
    // 押したらすぐ表示を変え、裏で保存する（続けて押したときは、最後に送った内容を正とする）
    S.settings = next;
    refresh();
    const seq = S.weeklySeq = (S.weeklySeq || 0) + 1;
    try {
      const res = await save(() => api('saveSettings', next));
      if (seq === S.weeklySeq) { S.settings = res.settings; refresh(); }
      toast(WD[Number(i)] + '曜日の営業を変更しました');
    } catch (e) {
      fail(e);
      if (seq === S.weeklySeq) { try { S.settings = (await api('boot')).settings; refresh(); } catch (e2) { /* 表示はそのまま */ } }
    }
    staleMonths();
    return;
  }
  if (MENU_ACTS.indexOf(a) >= 0) return ACTIONS.menu(a, b);
  return setActions(a, b);
};

/* ---------- 操作の受け付け ---------- */
$('view').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (S.tab === 'today') {
    const cc = b.closest('[data-cid]');
    if (cc) {
      const c = S.req.changes.find(x => x.id === cc.dataset.cid);
      const d = S.drafts['g' + c.id];
      if (a === 'cmode') { d.mode = b.dataset.mode; d.edited = false; d.text = chgTemplate(c, d.mode); refresh(); }
      else if (a === 'cresetText') { d.edited = false; d.text = chgTemplate(c, d.mode); refresh(); }
      else if (a === 'csend') await sendChangeReply(c, d, b, false);
      return;
    }
    const card = b.closest('[data-rid]');
    if (card) {
      const r = S.req.waiting.find(x => x.id === card.dataset.rid);
      const d = S.drafts[r.id];
      if (a === 'mode') { d.mode = b.dataset.mode; d.edited = false; d.text = template(r, d); refresh(); }
      else if (a === 'resetText') { d.edited = false; d.text = template(r, d); refresh(); }
      else if (a === 'send') await sendReply(r, d, b, false);
      return;
    }
  }
  if (b.tagName === 'INPUT' && b.type !== 'radio') return;
  const handler = ACTIONS[S.tab];
  if (handler) await handler(a, b);
});

$('view').addEventListener('input', e => {
  if (S.tab === 'book' && S.edit && e.target.dataset.e) {
    const k = e.target.dataset.e;
    S.edit[k] = e.target.value;
    if (k === 'text') S.edit.edited = true;
    if ($('eErr')) $('eErr').textContent = '';
    if (k === 'guests' || k === 'name') softUpdateEdit();
    return;
  }
  if (S.tab === 'cust' && e.target.id === 'mergeQ') {
    S.mergeQ = e.target.value;
    const pos = e.target.selectionStart;
    refresh();
    const el = $('mergeQ'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) { /* 何もしない */ } }
    return;
  }
  if (S.tab === 'cust' && e.target.id === 'custQ') {
    S.custQ = e.target.value;
    clearTimeout(S.custTimer);
    S.custTimer = setTimeout(reload, 300);
    return;
  }
  if (S.tab !== 'today') return;
  const cc = e.target.closest('[data-cid]');
  if (cc && e.target.dataset.act === 'ctext') {
    const d = S.drafts['g' + cc.dataset.cid];
    d.text = e.target.value; d.edited = true;
    const er = cc.querySelector('[data-cerr]'); if (er) er.textContent = '';
    return;
  }
  const card = e.target.closest('[data-rid]');
  if (!card || e.target.dataset.act !== 'text') return;
  const d = S.drafts[card.dataset.rid];
  d.text = e.target.value; d.edited = true;
  const er = card.querySelector('[data-err]'); if (er) er.textContent = '';
});

$('view').addEventListener('change', e => {
  if (S.tab === 'today') {
    const card = e.target.closest('[data-rid]');
    if (card && e.target.dataset.act === 'offer') {
      const r = S.req.waiting.find(x => x.id === card.dataset.rid);
      const d = S.drafts[r.id];
      d.offer = Number(e.target.value); d.edited = false; d.text = template(r, d);
      refresh();
    }
  } else if (S.tab === 'book') {
    if (S.edit && e.target.dataset.e) {
      S.edit[e.target.dataset.e] = e.target.value;
      if (['date', 'time', 'courseId'].indexOf(e.target.dataset.e) >= 0) updateEditView();
      return;
    }
    if (e.target.id === 'hAll') { readHold(); }
    if (e.target.id === 'hDate' && e.target.value) { readHold(); goDayKeep(e.target.value, S.hold); }
  }
});

$('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  const tab = t.dataset.tab;
  if (tab === S.tab) {
    // 今のタブをもう一度押したら一番上へ（お客様を開いているときは一覧へ戻る）
    if (tab === 'cust' && S.custSel) { closeCust(); return; }
    window.scrollTo({ top: 0, behavior: M.reduce() ? 'auto' : 'smooth' });
    reload();
    return;
  }
  // お客様タブは一覧から（一覧で見ていた位置に戻す）
  if (tab === 'cust' && S.custSel) { S.custSel = null; S.scroll.cust = S.scroll.custList || 0; }
  showTab(tab);
});
$('loginBtn').onclick = login;
$('pw').onkeydown = e => { if (e.key === 'Enter') login(); };
$('pw').oninput = () => { $('loginErr').textContent = ''; };
document.addEventListener('visibilitychange', () => {
  // アプリに戻ってきたら、表示はそのままで裏で最新にする
  if (document.visibilityState === 'visible' && !$('appView').classList.contains('hidden')) reload();
});

boot();
</script>
</body>
</html>
